<script>var C={"pt": "<h1>O que é verdadeiro e o que não é</h1><p>Adão e Eva (Gênesis 1–5) conferido com a ciência. Uma afirmação por linha, com versículo e fonte.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Não bate com a realidade: 20</span><span style=\"color:#7dcea0\">✅ Bate com a realidade: 4</span><span style=\"color:#e0c36a\">❔ Não verificável: 2</span></div><table><thead><tr><th>Afirmação (versículo)</th><th>Veredito</th><th>Evidência / fonte</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>1. O universo e a Terra foram feitos em seis dias</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/2\" target=\"_blank\" rel=\"noopener\">Gênesis 2:2</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/1/31\" target=\"_blank\" rel=\"noopener\">Gênesis 1:31</a></span><q>Ora, havendo Deus completado no dia sétimo a obra que tinha feito, descansou nesse dia de toda a obra que fizera.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A Terra tem cerca de 4,54 bilhões de anos (datação radiométrica de meteoritos e rochas); o universo, cerca de 13,8 bilhões. <a href=\"https://pubs.usgs.gov/gip/geotime/age.html\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>2. Houve luz, dia e noite antes de existir o Sol (dia 1 × dia 4)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/1/3\" target=\"_blank\" rel=\"noopener\">Gênesis 1:3</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/1/16\" target=\"_blank\" rel=\"noopener\">Gênesis 1:16</a></span><q>Disse Deus: haja luz. E houve luz.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Dia e noite são a rotação da Terra diante do Sol. O Sol (≈4,6 bilhões de anos) é mais antigo que a Terra. <a href=\"https://en.wikipedia.org/wiki/Sun\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>3. Árvores frutíferas surgiram antes do Sol (dia 3 × dia 4)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/1/11\" target=\"_blank\" rel=\"noopener\">Gênesis 1:11</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/1/16\" target=\"_blank\" rel=\"noopener\">Gênesis 1:16</a></span><q>E disse Deus: Produza a terra relva, ervas que dêem semente, e árvores frutíferas que, segundo as suas espécies, dêem fruto que tenha em si a sua semente, sobre…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Plantas precisam de luz solar; plantas com flor e fruto aparecem nos fósseis há ≈130 milhões de anos, bilhões de anos depois do Sol. <a href=\"https://en.wikipedia.org/wiki/Flowering_plant\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>4. As aves vieram antes dos animais terrestres (dia 5 × dia 6)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/1/20\" target=\"_blank\" rel=\"noopener\">Gênesis 1:20</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/1/24\" target=\"_blank\" rel=\"noopener\">Gênesis 1:24</a></span><q>E disse Deus: Produzam as águas cardumes de seres viventes; e voem as aves acima da terra no firmamento do céu.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Vertebrados terrestres existem há ≈370 milhões de anos; as aves descendem de dinossauros terópodes e surgem há ≈150 milhões. <a href=\"https://en.wikipedia.org/wiki/Origin_of_birds\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>5. Os grandes animais do mar (baleias) vieram antes dos animais da terra</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/1/21\" target=\"_blank\" rel=\"noopener\">Gênesis 1:21</a></span><q>Criou, pois, Deus os monstros marinhos, e todos os seres viventes que se arrastavam, os quais as águas produziram abundantemente segundo as suas espécies; e tod…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">As baleias evoluíram de mamíferos terrestres há ≈50 milhões de anos (fósseis como Pakicetus e Ambulocetus). <a href=\"https://en.wikipedia.org/wiki/Evolution_of_cetaceans\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>6. Os seres humanos chegaram por último, depois dos outros animais</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/1/27\" target=\"_blank\" rel=\"noopener\">Gênesis 1:27</a></span><q>Criou, pois, Deus o homem à sua imagem; à imagem de Deus o criou; homem e mulher os criou.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Bate no geral: o Homo sapiens tem ≈300 mil anos, muito depois da maioria dos grupos de animais. <a href=\"https://www.nature.com/articles/nature22336\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>7. O homem foi formado do pó da terra, já adulto, num só ato</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/7\" target=\"_blank\" rel=\"noopener\">Gênesis 2:7</a></span><q>E formou o Senhor Deus o homem do pó da terra, e soprou-lhe nas narinas o fôlego da vida; e o homem tornou-se alma vivente.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">O corpo humano é feito de elementos comuns na natureza (isso bate como imagem), mas os humanos surgiram por evolução gradual, compartilhando DNA com outros primatas. <a href=\"https://en.wikipedia.org/wiki/Human_evolution\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>8. A mulher foi feita de uma costela do homem</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/22\" target=\"_blank\" rel=\"noopener\">Gênesis 2:22</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/2/21\" target=\"_blank\" rel=\"noopener\">Gênesis 2:21</a></span><q>e da costela que o senhor Deus lhe tomara, formou a mulher e a trouxe ao homem.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Não há mecanismo biológico para isso; homens e mulheres têm o mesmo número de costelas (12 pares). <a href=\"https://en.wikipedia.org/wiki/Rib_cage\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>9. Adão deu nome a todos os animais antes de a mulher ser criada (no mesmo dia 6)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/20\" target=\"_blank\" rel=\"noopener\">Gênesis 2:20</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/2/19\" target=\"_blank\" rel=\"noopener\">Gênesis 2:19</a></span><q>Assim o homem deu nomes a todos os animais domésticos, às aves do céu e a todos os animais do campo; mas para o homem não se achava ajudadora idônea.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Estimam-se ≈8,7 milhões de espécies de eucariontes; nomear todas num dia é impossível. <a href=\"https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1001127\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>10. Toda a humanidade descende de um único casal</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/20\" target=\"_blank\" rel=\"noopener\">Gênesis 3:20</a></span><q>Chamou Adão à sua mulher Eva, porque era a mãe de todos os viventes.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A diversidade do nosso DNA mostra que a população ancestral nunca caiu abaixo de alguns milhares de pessoas (estimativas de ≈10 mil). <a href=\"https://www.nature.com/articles/nature10231\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>11. A &#x27;Eva mitocondrial&#x27; e o &#x27;Adão do cromossomo Y&#x27; provam o casal bíblico</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/20\" target=\"_blank\" rel=\"noopener\">Gênesis 3:20</a></span><q>Chamou Adão à sua mulher Eva, porque era a mãe de todos os viventes.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">São ancestrais de linhagens específicas, viveram em épocas diferentes (dezenas de milhares de anos de distância) e conviviam com milhares de outras pessoas. <a href=\"https://en.wikipedia.org/wiki/Mitochondrial_Eve\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>12. Uma serpente falou e argumentou com a mulher</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/1\" target=\"_blank\" rel=\"noopener\">Gênesis 3:1</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/3/4\" target=\"_blank\" rel=\"noopener\">Gênesis 3:4</a></span><q>Ora, a serpente era o mais astuto de todos os animais do campo, que o Senhor Deus tinha feito. E esta disse à mulher: É assim que Deus disse: Não comereis de to…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Serpentes não têm cordas vocais, lábios nem cérebro capaz de linguagem; só sibilam. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>13. A serpente passou a rastejar como castigo (antes teria tido outra forma)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/14\" target=\"_blank\" rel=\"noopener\">Gênesis 3:14</a></span><q>Então o Senhor Deus disse à serpente: Porquanto fizeste isso, maldita serás tu dentre todos os animais domésticos, e dentre todos os animais do campo; sobre o t…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Fósseis mostram serpentes com patas traseiras há ≈95 milhões de anos (Najash); a perda das patas foi gradual, muito antes dos humanos. <a href=\"https://en.wikipedia.org/wiki/Najash\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>14. As serpentes comem pó</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/14\" target=\"_blank\" rel=\"noopener\">Gênesis 3:14</a></span><q>Então o Senhor Deus disse à serpente: Porquanto fizeste isso, maldita serás tu dentre todos os animais domésticos, e dentre todos os animais do campo; sobre o t…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Todas as serpentes são carnívoras (roedores, ovos, peixes, insetos). Elas captam cheiros com a língua, o que pode ter inspirado a imagem. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>15. Não havia morte antes da desobediência de Adão</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/17\" target=\"_blank\" rel=\"noopener\">Gênesis 2:17</a> · <a href=\"https://www.bibliaonline.com.br/acf/rm/5/12\" target=\"_blank\" rel=\"noopener\">Romanos 5:12</a></span><q>mas da árvore do conhecimento do bem e do mal, dessa não comerás; porque no dia em que dela comeres, certamente morrerás.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Fósseis registram bilhões de anos de vida e morte, cinco extinções em massa e até câncer ósseo num dinossauro de ≈76 milhões de anos. <a href=\"https://doi.org/10.1016/S1470-2045(20)30171-6\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>16. O parto humano é doloroso</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/16\" target=\"_blank\" rel=\"noopener\">Gênesis 3:16</a></span><q>E à mulher disse: Multiplicarei grandemente a dor da tua conceição; em dor darás à luz filhos; e o teu desejo será para o teu marido, e ele te dominará.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Bate: o parto humano é mais difícil que o da maioria dos primatas. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>17. A dor do parto é castigo pela desobediência de Eva</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/16\" target=\"_blank\" rel=\"noopener\">Gênesis 3:16</a></span><q>E à mulher disse: Multiplicarei grandemente a dor da tua conceição; em dor darás à luz filhos; e o teu desejo será para o teu marido, e ele te dominará.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A explicação científica principal é anatômica: pelve estreitada pelo andar sobre duas pernas e bebê de cabeça grande (&#x27;dilema obstétrico&#x27;, ainda debatido nos detalhes). Outros mamíferos também sentem dor ao parir. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>18. O Éden ficava perto dos rios Tigre e Eufrates</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/2/14\" target=\"_blank\" rel=\"noopener\">Gênesis 2:14</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/2/10\" target=\"_blank\" rel=\"noopener\">Gênesis 2:10</a></span><q>O nome do terceiro rio é Tigre: este é o que corre pelo oriente da Assíria. E o quarto rio é o Eufrates.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Bate na geografia: esses rios existem na Mesopotâmia, berço de cidades antigas. Os rios Pisom e Giom nunca foram identificados com segurança. <a href=\"https://en.wikipedia.org/wiki/Garden_of_Eden\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>19. Existia uma árvore cujo fruto dava vida eterna</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/22\" target=\"_blank\" rel=\"noopener\">Gênesis 3:22</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/2/9\" target=\"_blank\" rel=\"noopener\">Gênesis 2:9</a></span><q>Então disse o Senhor Deus: Eis que o homem se tem tornado como um de nós, conhecendo o bem e o mal. Ora, não suceda que estenda a sua mão, e tome também da árvo…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">Não há como testar. Nenhuma planta conhecida impede o envelhecimento; a mesma ideia (planta da vida) aparece na Epopeia de Gilgamesh. <a href=\"https://en.wikipedia.org/wiki/Epic_of_Gilgamesh\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>20. Querubins e uma espada flamejante guardam o caminho do Éden</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/24\" target=\"_blank\" rel=\"noopener\">Gênesis 3:24</a></span><q>E havendo lançado fora o homem, pôs ao oriente do jardim do Éden os querubins, e uma espada flamejante que se volvia por todos os lados, para guardar o caminho …</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">Afirmação sobrenatural, não verificável. Figuras aladas guardiãs (como os lamassu) eram comuns na arte da Mesopotâmia. <a href=\"https://en.wikipedia.org/wiki/Lamassu\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>21. Caim, filho do primeiro casal, achou uma esposa e construiu uma cidade</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/17\" target=\"_blank\" rel=\"noopener\">Gênesis 4:17</a></span><q>Conheceu Caim a sua mulher, a qual concebeu, e deu à luz a Enoque. Caim edificou uma cidade, e lhe deu o nome do filho, Enoque.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Uma cidade exige uma população grande. O texto não diz de onde veio a esposa; as primeiras cidades (como Uruk) surgem há ≈6 mil anos, em sociedades de milhares de pessoas. <a href=\"https://en.wikipedia.org/wiki/Uruk\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>22. Caim temia que &#x27;qualquer um&#x27; que o encontrasse o matasse</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/14\" target=\"_blank\" rel=\"noopener\">Gênesis 4:14</a></span><q>Eis que hoje me lanças da face da terra; também da tua presença ficarei escondido; serei fugitivo e vagabundo na terra; e qualquer que me encontrar matar-me-á.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Pelo próprio relato, só existiriam Adão, Eva e Caim. O medo pressupõe outras pessoas, o que combina com a genética, não com o casal único. <a href=\"https://en.wikipedia.org/wiki/Wife_of_Cain\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>23. Agricultura, pastoreio e ferramentas de ferro surgiram nas primeiras sete gerações</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/22\" target=\"_blank\" rel=\"noopener\">Gênesis 4:22</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/4/2\" target=\"_blank\" rel=\"noopener\">Gênesis 4:2</a></span><q>A Zila também nasceu um filho, Tubal-Caim, fabricante de todo instrumento cortante de cobre e de ferro; e a irmã de Tubal-Caim foi Naama.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A agricultura começou há ≈11,5 mil anos; a metalurgia do ferro em larga escala, só há ≈3,2 mil anos. São milhares de anos de diferença. <a href=\"https://en.wikipedia.org/wiki/Iron_Age\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>24. Pessoas viviam 900 anos ou mais (Adão 930, Matusalém 969)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/5/5\" target=\"_blank\" rel=\"noopener\">Gênesis 5:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/5/27\" target=\"_blank\" rel=\"noopener\">Gênesis 5:27</a></span><q>Todos os dias que Adão viveu foram novecentos e trinta anos; e morreu.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A maior idade comprovada com documentos é 122 anos (Jeanne Calment). Esqueletos antigos não mostram idades maiores. <a href=\"https://en.wikipedia.org/wiki/Jeanne_Calment\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>25. Somando as genealogias, o mundo teria ≈6 mil anos (Ussher: 4004 a.C.)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/5/3\" target=\"_blank\" rel=\"noopener\">Gênesis 5:3</a></span><q>Adão viveu cento e trinta anos, e gerou um filho à sua semelhança, conforme a sua imagem, e pôs-lhe o nome de Sete.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Göbekli Tepe tem ≈11,5 mil anos, Jericó ≈11 mil, as pinturas da caverna Chauvet ≈36 mil, e o Homo sapiens ≈300 mil. <a href=\"https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>26. O ser humano tem consciência moral: pensa no bem e no mal</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/22\" target=\"_blank\" rel=\"noopener\">Gênesis 3:22</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/3/5\" target=\"_blank\" rel=\"noopener\">Gênesis 3:5</a></span><q>Então disse o Senhor Deus: Eis que o homem se tem tornado como um de nós, conhecendo o bem e o mal. Ora, não suceda que estenda a sua mão, e tome também da árvo…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Bate como observação: a capacidade de julgar o certo e o errado é uma marca humana estudada pela psicologia e pela neurociência. A causa contada (um fruto) não é verificável. <a href=\"https://en.wikipedia.org/wiki/Morality#Neuroscience\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr></tbody></table><p class=\"nota\">Bíblia: Almeida (domínio público). “Não bate com a realidade” quer dizer que, como fato literal, não confere com a evidência; não é um julgamento sobre a fé de ninguém.</p>", "en": "<h1>What is true and what is not</h1><p>Adam and Eve (Genesis 1–5) checked against science. One claim per row, with verse and source.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Does not match reality: 20</span><span style=\"color:#7dcea0\">✅ Matches reality: 4</span><span style=\"color:#e0c36a\">❔ Not verifiable: 2</span></div><table><thead><tr><th>Claim (verse)</th><th>Verdict</th><th>Evidence / source</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>1. The universe and Earth were made in six days</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A2&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:2</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A31&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:31</a></span><q>And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Earth is about 4.54 billion years old (radiometric dating of meteorites and rocks); the universe about 13.8 billion. <a href=\"https://pubs.usgs.gov/gip/geotime/age.html\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>2. There was light, day and night before the Sun existed (day 1 vs day 4)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A3&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:3</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:16</a></span><q>And God said, Let there be light: and there was light.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Day and night are Earth&#x27;s rotation facing the Sun. The Sun (≈4.6 billion years) is older than Earth. <a href=\"https://en.wikipedia.org/wiki/Sun\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>3. Fruit trees appeared before the Sun (day 3 vs day 4)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A11&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:11</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:16</a></span><q>And God said, Let the earth bring forth grass, the herb yielding seed, and the fruit tree yielding fruit after his kind, whose seed is in itself, upon the earth…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Plants need sunlight; flowering and fruiting plants appear in fossils ≈130 million years ago, billions of years after the Sun. <a href=\"https://en.wikipedia.org/wiki/Flowering_plant\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>4. Birds came before land animals (day 5 vs day 6)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A20&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:20</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A24&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:24</a></span><q>And God said, Let the waters bring forth abundantly the moving creature that hath life, and fowl that may fly above the earth in the open firmament of heaven.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Land vertebrates exist since ≈370 million years ago; birds descend from theropod dinosaurs and appear ≈150 million years ago. <a href=\"https://en.wikipedia.org/wiki/Origin_of_birds\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>5. Great sea creatures (whales) came before land animals</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A21&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:21</a></span><q>And God created great whales, and every living creature that moveth, which the waters brought forth abundantly, after their kind, and every winged fowl after hi…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Whales evolved from land mammals ≈50 million years ago (fossils such as Pakicetus and Ambulocetus). <a href=\"https://en.wikipedia.org/wiki/Evolution_of_cetaceans\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>6. Humans arrived last, after the other animals</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+1%3A27&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 1:27</a></span><q>So God created man in his own image, in the image of God created he him; male and female created he them.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Broadly true: Homo sapiens is ≈300,000 years old, long after most animal groups. <a href=\"https://www.nature.com/articles/nature22336\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>7. Man was formed from the dust of the ground, already adult, in one act</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A7&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:7</a></span><q>And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The human body is made of common natural elements (true as an image), but humans arose by gradual evolution, sharing DNA with other primates. <a href=\"https://en.wikipedia.org/wiki/Human_evolution\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>8. Woman was made from a man&#x27;s rib</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A22&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A21&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:21</a></span><q>And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">There is no biological mechanism for this; men and women have the same number of ribs (12 pairs). <a href=\"https://en.wikipedia.org/wiki/Rib_cage\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>9. Adam named all the animals before woman was made (on the same day 6)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A20&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:20</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A19&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:19</a></span><q>And Adam gave names to all cattle, and to the fowl of the air, and to every beast of the field; but for Adam there was not found an help meet for him.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">An estimated ≈8.7 million eukaryotic species exist; naming them all in a day is impossible. <a href=\"https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1001127\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>10. All humanity descends from a single couple</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A20&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:20</a></span><q>And Adam called his wife’s name Eve; because she was the mother of all living.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The diversity of our DNA shows the ancestral population never fell below a few thousand people (estimates of ≈10,000). <a href=\"https://www.nature.com/articles/nature10231\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>11. &#x27;Mitochondrial Eve&#x27; and &#x27;Y-chromosome Adam&#x27; prove the biblical couple</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A20&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:20</a></span><q>And Adam called his wife’s name Eve; because she was the mother of all living.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">They are ancestors of specific lineages, lived at different times (tens of thousands of years apart) and lived among thousands of other people. <a href=\"https://en.wikipedia.org/wiki/Mitochondrial_Eve\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>12. A serpent spoke and argued with the woman</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A1&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:4</a></span><q>Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of eve…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Snakes have no vocal cords, lips or a brain capable of language; they only hiss. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>13. The serpent began crawling as a punishment (it had another form before)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:14</a></span><q>And the LORD God said unto the serpent, Because thou hast done this, thou art cursed above all cattle, and above every beast of the field; upon thy belly shalt …</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Fossils show snakes with hind legs ≈95 million years ago (Najash); leg loss was gradual, long before humans. <a href=\"https://en.wikipedia.org/wiki/Najash\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>14. Snakes eat dust</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:14</a></span><q>And the LORD God said unto the serpent, Because thou hast done this, thou art cursed above all cattle, and above every beast of the field; upon thy belly shalt …</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">All snakes are carnivores (rodents, eggs, fish, insects). They pick up scents with their tongue, which may have inspired the image. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>15. There was no death before Adam&#x27;s disobedience</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A17&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:17</a> · <a href=\"https://www.biblegateway.com/passage/?search=Romans+5%3A12&version=KJV\" target=\"_blank\" rel=\"noopener\">Romans 5:12</a></span><q>But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof thou shalt surely die.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Fossils record billions of years of life and death, five mass extinctions and even bone cancer in a ≈76-million-year-old dinosaur. <a href=\"https://doi.org/10.1016/S1470-2045(20)30171-6\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>16. Human childbirth is painful</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:16</a></span><q>Unto the woman he said, I will greatly multiply thy sorrow and thy conception; in sorrow thou shalt bring forth children; and thy desire shall be to thy husband…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">True: human birth is harder than in most primates. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>17. Childbirth pain is a punishment for Eve&#x27;s disobedience</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:16</a></span><q>Unto the woman he said, I will greatly multiply thy sorrow and thy conception; in sorrow thou shalt bring forth children; and thy desire shall be to thy husband…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The main scientific explanation is anatomical: a pelvis narrowed by walking on two legs and a large-headed baby (the &#x27;obstetric dilemma&#x27;, still debated in detail). Other mammals also feel pain giving birth. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>18. Eden was near the Tigris and Euphrates rivers</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:14</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A10&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:10</a></span><q>And the name of the third river is Hiddekel: that is it which goeth toward the east of Assyria. And the fourth river is Euphrates.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Geographically true: these rivers exist in Mesopotamia, cradle of ancient cities. The Pishon and Gihon rivers were never securely identified. <a href=\"https://en.wikipedia.org/wiki/Garden_of_Eden\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>19. There was a tree whose fruit gave eternal life</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A22&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+2%3A9&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 2:9</a></span><q>And the LORD God said, Behold, the man is become as one of us, to know good and evil: and now, lest he put forth his hand, and take also of the tree of life, an…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">It cannot be tested. No known plant stops ageing; the same idea (a plant of life) appears in the Epic of Gilgamesh. <a href=\"https://en.wikipedia.org/wiki/Epic_of_Gilgamesh\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>20. Cherubim and a flaming sword guard the way to Eden</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A24&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:24</a></span><q>So he drove out the man; and he placed at the east of the garden of Eden Cherubim, and a flaming sword which turned every way, to keep the way of the tree of li…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">A supernatural claim, not verifiable. Winged guardian figures (such as the lamassu) were common in Mesopotamian art. <a href=\"https://en.wikipedia.org/wiki/Lamassu\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>21. Cain, son of the first couple, found a wife and built a city</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A17&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:17</a></span><q>And Cain knew his wife; and she conceived, and bare Enoch: and he builded a city, and called the name of the city, after the name of his son, Enoch.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">A city requires a large population. The text does not say where the wife came from; the first cities (like Uruk) appear ≈6,000 years ago, in societies of thousands. <a href=\"https://en.wikipedia.org/wiki/Uruk\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>22. Cain feared that &#x27;whoever&#x27; found him would kill him</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:14</a></span><q>Behold, thou hast driven me out this day from the face of the earth; and from thy face shall I be hid; and I shall be a fugitive and a vagabond in the earth; an…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">By the story itself, only Adam, Eve and Cain would exist. The fear presupposes other people, which fits genetics, not a single couple. <a href=\"https://en.wikipedia.org/wiki/Wife_of_Cain\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>23. Farming, herding and iron tools arose within the first seven generations</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A22&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A2&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:2</a></span><q>And Zillah, she also bare Tubal-cain, an instructer of every artificer in brass and iron: and the sister of Tubal-cain was Naamah.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Farming began ≈11,500 years ago; large-scale iron working only ≈3,200 years ago. Thousands of years apart. <a href=\"https://en.wikipedia.org/wiki/Iron_Age\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>24. People lived 900 years or more (Adam 930, Methuselah 969)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+5%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 5:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+5%3A27&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 5:27</a></span><q>And all the days that Adam lived were nine hundred and thirty years: and he died.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The longest documented human lifespan is 122 years (Jeanne Calment). Ancient skeletons show no greater ages. <a href=\"https://en.wikipedia.org/wiki/Jeanne_Calment\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>25. Adding up the genealogies, the world would be ≈6,000 years old (Ussher: 4004 BC)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+5%3A3&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 5:3</a></span><q>And Adam lived an hundred and thirty years, and begat a son in his own likeness, after his image; and called his name Seth:</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Göbekli Tepe is ≈11,500 years old, Jericho ≈11,000, the Chauvet cave paintings ≈36,000 and Homo sapiens ≈300,000. <a href=\"https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>26. Humans have a moral conscience: they think about good and evil</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A22&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:5</a></span><q>And the LORD God said, Behold, the man is become as one of us, to know good and evil: and now, lest he put forth his hand, and take also of the tree of life, an…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">True as an observation: the ability to judge right and wrong is a human trait studied by psychology and neuroscience. The cause told (a fruit) is not verifiable. <a href=\"https://en.wikipedia.org/wiki/Morality#Neuroscience\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr></tbody></table><p class=\"nota\">Bible: King James Version (public domain). “Does not match reality” means that as literal fact it does not agree with the evidence; it is not a judgement on anyone&#x27;s faith.</p>", "es": "<h1>Lo que es verdadero y lo que no</h1><p>Adán y Eva (Génesis 1–5) comparado con la ciencia. Una afirmación por fila, con versículo y fuente.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ No coincide con la realidad: 20</span><span style=\"color:#7dcea0\">✅ Coincide con la realidad: 4</span><span style=\"color:#e0c36a\">❔ No verificable: 2</span></div><table><thead><tr><th>Afirmación (versículo)</th><th>Veredicto</th><th>Evidencia / fuente</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>1. El universo y la Tierra fueron hechos en seis días</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A2&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:2</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A31&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:31</a></span><q>Y acabó Dios en el día séptimo su obra que hizo, y reposó el día séptimo de toda su obra que había hecho.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La Tierra tiene unos 4.540 millones de años (datación radiométrica de meteoritos y rocas); el universo, unos 13.800 millones. <a href=\"https://pubs.usgs.gov/gip/geotime/age.html\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>2. Hubo luz, día y noche antes de existir el Sol (día 1 vs día 4)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A3&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:3</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:16</a></span><q>Y dijo Dios: Sea la luz: y fué la luz.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Día y noche son la rotación de la Tierra frente al Sol. El Sol (≈4.600 millones de años) es más antiguo que la Tierra. <a href=\"https://en.wikipedia.org/wiki/Sun\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>3. Los árboles frutales surgieron antes del Sol (día 3 vs día 4)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A11&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:11</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:16</a></span><q>Y dijo Dios: Produzca la tierra hierba verde, hierba que dé simiente; árbol de fruto que dé fruto según su género, que su simiente esté en él, sobre la tierra: …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Las plantas necesitan luz solar; las plantas con flor y fruto aparecen en los fósiles hace ≈130 millones de años. <a href=\"https://en.wikipedia.org/wiki/Flowering_plant\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>4. Las aves vinieron antes que los animales terrestres (día 5 vs día 6)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A20&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:20</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A24&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:24</a></span><q>Y dijo Dios: Produzcan las aguas reptil de ánima viviente, y aves que vuelen sobre la tierra, en la abierta expansión de los cielos.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Los vertebrados terrestres existen desde hace ≈370 millones de años; las aves descienden de dinosaurios terópodos (≈150 millones). <a href=\"https://en.wikipedia.org/wiki/Origin_of_birds\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>5. Los grandes animales del mar (ballenas) vinieron antes que los de tierra</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A21&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:21</a></span><q>Y crió Dios las grandes ballenas, y toda cosa viva que anda arrastrando, que las aguas produjeron según su género, y toda ave alada según su especie: y vió Dios…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Las ballenas evolucionaron de mamíferos terrestres hace ≈50 millones de años (fósiles como Pakicetus y Ambulocetus). <a href=\"https://en.wikipedia.org/wiki/Evolution_of_cetaceans\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>6. Los seres humanos llegaron al final, después de los otros animales</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+1%3A27&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 1:27</a></span><q>Y crió Dios al hombre á su imagen, á imagen de Dios lo crió; varón y hembra los crió.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Coincide en general: el Homo sapiens tiene ≈300.000 años, mucho después de la mayoría de los grupos animales. <a href=\"https://www.nature.com/articles/nature22336\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>7. El hombre fue formado del polvo de la tierra, ya adulto, en un solo acto</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A7&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:7</a></span><q>Formó, pues, Jehová Dios al hombre del polvo de la tierra, y alentó en su nariz soplo de vida; y fué el hombre en alma viviente.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El cuerpo humano está hecho de elementos comunes (coincide como imagen), pero los humanos surgieron por evolución gradual, compartiendo ADN con otros primates. <a href=\"https://en.wikipedia.org/wiki/Human_evolution\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>8. La mujer fue hecha de una costilla del hombre</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A22&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A21&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:21</a></span><q>Y de la costilla que Jehová Dios tomó del hombre, hizo una mujer, y trájola al hombre.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">No hay mecanismo biológico para ello; hombres y mujeres tienen el mismo número de costillas (12 pares). <a href=\"https://en.wikipedia.org/wiki/Rib_cage\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>9. Adán puso nombre a todos los animales antes de crear a la mujer (el mismo día 6)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A20&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:20</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A19&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:19</a></span><q>Y puso Adam nombres á toda bestia y ave de los cielos y á todo animal del campo: mas para Adam no halló ayuda que estuviese idónea para él.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Se estiman ≈8,7 millones de especies eucariotas; nombrarlas todas en un día es imposible. <a href=\"https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1001127\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>10. Toda la humanidad desciende de una sola pareja</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A20&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:20</a></span><q>Y llamó el hombre el nombre de su mujer, Eva; por cuanto ella era madre de todos los vivientes.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La diversidad de nuestro ADN muestra que la población ancestral nunca bajó de unos miles de personas (estimaciones de ≈10.000). <a href=\"https://www.nature.com/articles/nature10231\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>11. La &#x27;Eva mitocondrial&#x27; y el &#x27;Adán cromosómico Y&#x27; prueban la pareja bíblica</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A20&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:20</a></span><q>Y llamó el hombre el nombre de su mujer, Eva; por cuanto ella era madre de todos los vivientes.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Son ancestros de linajes concretos, vivieron en épocas distintas (decenas de miles de años de diferencia) y convivían con miles de personas. <a href=\"https://en.wikipedia.org/wiki/Mitochondrial_Eve\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>12. Una serpiente habló y discutió con la mujer</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A1&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:4</a></span><q>EMPERO la serpiente era astuta, más que todos los animales del campo que Jehová Dios había hecho; la cual dijo á la mujer: ¿Conque Dios os ha dicho: No comáis d…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Las serpientes no tienen cuerdas vocales, labios ni cerebro capaz de lenguaje; solo sisean. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>13. La serpiente pasó a arrastrarse como castigo (antes tenía otra forma)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:14</a></span><q>Y Jehová Dios dijo á la serpiente: Por cuanto esto hiciste, maldita serás entre todas las bestias y entre todos los animales del campo; sobre tu pecho andarás, …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Los fósiles muestran serpientes con patas traseras hace ≈95 millones de años (Najash); la pérdida fue gradual, mucho antes de los humanos. <a href=\"https://en.wikipedia.org/wiki/Najash\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>14. Las serpientes comen polvo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:14</a></span><q>Y Jehová Dios dijo á la serpiente: Por cuanto esto hiciste, maldita serás entre todas las bestias y entre todos los animales del campo; sobre tu pecho andarás, …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Todas las serpientes son carnívoras (roedores, huevos, peces, insectos). Captan olores con la lengua, lo que pudo inspirar la imagen. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>15. No había muerte antes de la desobediencia de Adán</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A17&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:17</a> · <a href=\"https://www.biblegateway.com/passage/?search=Romanos+5%3A12&version=RVA\" target=\"_blank\" rel=\"noopener\">Romanos 5:12</a></span><q>Mas del árbol de ciencia del bien y del mal no comerás de él; porque el día que de él comieres, morirás.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Los fósiles registran miles de millones de años de vida y muerte, cinco extinciones masivas e incluso cáncer óseo en un dinosaurio de ≈76 millones de años. <a href=\"https://doi.org/10.1016/S1470-2045(20)30171-6\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>16. El parto humano es doloroso</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:16</a></span><q>A la mujer dijo: Multiplicaré en gran manera tus dolores y tus preñeces; con dolor parirás los hijos; y á tu marido será tu deseo, y él se enseñoreará de ti.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Coincide: el parto humano es más difícil que el de la mayoría de los primates. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>17. El dolor del parto es castigo por la desobediencia de Eva</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:16</a></span><q>A la mujer dijo: Multiplicaré en gran manera tus dolores y tus preñeces; con dolor parirás los hijos; y á tu marido será tu deseo, y él se enseñoreará de ti.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La explicación científica principal es anatómica: pelvis estrechada por caminar en dos piernas y bebé de cabeza grande (&#x27;dilema obstétrico&#x27;, aún debatido). Otros mamíferos también sienten dolor al parir. <a href=\"https://en.wikipedia.org/wiki/Obstetrical_dilemma\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>18. El Edén estaba cerca de los ríos Tigris y Éufrates</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:14</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A10&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:10</a></span><q>Y el nombre del tercer río es Hiddekel: éste es el que va delante de Asiria. Y el cuarto río es el Eufrates.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Coincide en geografía: esos ríos existen en Mesopotamia. Los ríos Pisón y Gihón nunca fueron identificados con seguridad. <a href=\"https://en.wikipedia.org/wiki/Garden_of_Eden\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>19. Existía un árbol cuyo fruto daba vida eterna</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A22&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+2%3A9&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 2:9</a></span><q>Y dijo Jehová Dios: He aquí el hombre es como uno de Nos sabiendo el bien y el mal: ahora, pues, porque no alargue su mano, y tome también del árbol de la vida,…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">No se puede comprobar. Ninguna planta conocida detiene el envejecimiento; la misma idea (planta de la vida) aparece en la Epopeya de Gilgamesh. <a href=\"https://en.wikipedia.org/wiki/Epic_of_Gilgamesh\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>20. Querubines y una espada encendida guardan el camino del Edén</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A24&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:24</a></span><q>Echó, pues, fuera al hombre, y puso al oriente del huerto de Edén querubines, y una espada encendida que se revolvía á todos lados, para guardar el camino del á…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">Afirmación sobrenatural, no verificable. Figuras aladas guardianas (como los lamassu) eran comunes en el arte de Mesopotamia. <a href=\"https://en.wikipedia.org/wiki/Lamassu\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>21. Caín, hijo de la primera pareja, halló esposa y edificó una ciudad</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+4%3A17&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:17</a></span><q>Y conoció Caín á su mujer, la cual concibió y parió á Henoch: y edificó una ciudad, y llamó el nombre de la ciudad del nombre de su hijo, Henoch.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Una ciudad exige una población grande. El texto no dice de dónde vino la esposa; las primeras ciudades (como Uruk) surgen hace ≈6.000 años, en sociedades de miles. <a href=\"https://en.wikipedia.org/wiki/Uruk\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>22. Caín temía que &#x27;cualquiera&#x27; que lo hallase lo matara</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+4%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:14</a></span><q>He aquí me echas hoy de la faz de la tierra, y de tu presencia me esconderé; y seré errante y extranjero en la tierra; y sucederá que cualquiera que me hallare,…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Según el propio relato solo existirían Adán, Eva y Caín. El miedo presupone otras personas, lo que encaja con la genética, no con una pareja única. <a href=\"https://en.wikipedia.org/wiki/Wife_of_Cain\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>23. La agricultura, el pastoreo y las herramientas de hierro surgieron en las primeras siete generaciones</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+4%3A22&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+4%3A2&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:2</a></span><q>Y Zilla también parió á Tubal-Caín, acicalador de toda obra de metal y de hierro: y la hermana de Tubal-Caín fué Naama.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La agricultura comenzó hace ≈11.500 años; la metalurgia del hierro a gran escala solo hace ≈3.200 años. Miles de años de diferencia. <a href=\"https://en.wikipedia.org/wiki/Iron_Age\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>24. Las personas vivían 900 años o más (Adán 930, Matusalén 969)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+5%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 5:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+5%3A27&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 5:27</a></span><q>Y fueron todos los días que vivió Adam novecientos y treinta años, y murió.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La mayor edad documentada es de 122 años (Jeanne Calment). Los esqueletos antiguos no muestran edades mayores. <a href=\"https://en.wikipedia.org/wiki/Jeanne_Calment\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>25. Sumando las genealogías, el mundo tendría ≈6.000 años (Ussher: 4004 a.C.)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+5%3A3&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 5:3</a></span><q>Y vivió Adam ciento y treinta años, y engendró un hijo á su semejanza, conforme á su imagen, y llamó su nombre Seth.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Göbekli Tepe tiene ≈11.500 años, Jericó ≈11.000, las pinturas de la cueva Chauvet ≈36.000 y el Homo sapiens ≈300.000. <a href=\"https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>26. El ser humano tiene conciencia moral: piensa en el bien y el mal</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A22&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:22</a> · <a href=\"https://www.biblegateway.com/passage/?search=G%C3%A9nesis+3%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:5</a></span><q>Y dijo Jehová Dios: He aquí el hombre es como uno de Nos sabiendo el bien y el mal: ahora, pues, porque no alargue su mano, y tome también del árbol de la vida,…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Coincide como observación: la capacidad de juzgar el bien y el mal es un rasgo humano estudiado por la psicología. La causa contada (un fruto) no es verificable. <a href=\"https://en.wikipedia.org/wiki/Morality#Neuroscience\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr></tbody></table><p class=\"nota\">Biblia: Reina-Valera 1909 (dominio público). “No coincide con la realidad” significa que, como hecho literal, no concuerda con la evidencia; no es un juicio sobre la fe de nadie.</p>"};var l=(new URLSearchParams(location.search).get("lang")||"").slice(0,2);if(!C[l]){try{l=String(localStorage.getItem("ms-lang")||"pt").replace(/"/g,"").slice(0,2)}catch(e){l="pt"}if(!C[l])l="pt"}
document.documentElement.lang=l;document.getElementById("c").innerHTML=C[l];document.querySelectorAll(".lang a").forEach(function(a){if(a.dataset.l===l)a.className="on"});</script></body></html>
