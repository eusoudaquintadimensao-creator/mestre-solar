<script>var C={"pt": "<h1>O que é verdadeiro e o que não é</h1><p>Gênesis à prova: o que a ciência, a história e a psicologia mostram. Uma afirmação por linha, com versículo e fonte.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Não bate com a realidade: 10</span><span style=\"color:#7dcea0\">✅ Bate com a realidade: 11</span><span style=\"color:#e0c36a\">❔ Não verificável: 3</span></div><table><thead><tr><th>Afirmação (versículo)</th><th>Veredito</th><th>Evidência / fonte</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>1. Uma serpente falou e argumentou com uma mulher</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/1\" target=\"_blank\" rel=\"noopener\">Gênesis 3:1</a></span><q>Ora, a serpente era o mais astuto de todos os animais do campo, que o Senhor Deus tinha feito. E esta disse à mulher: É assim que Deus disse: Não comereis de to…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Serpentes não têm cordas vocais nem cérebro para linguagem; animal falante é recurso de fábula. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>2. No texto de Gênesis, a serpente era Satanás disfarçado</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/1\" target=\"_blank\" rel=\"noopener\">Gênesis 3:1</a> · <a href=\"https://www.bibliaonline.com.br/acf/ap/12/9\" target=\"_blank\" rel=\"noopener\">Apocalipse 12:9</a></span><q>Ora, a serpente era o mais astuto de todos os animais do campo, que o Senhor Deus tinha feito. E esta disse à mulher: É assim que Deus disse: Não comereis de to…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Gênesis a chama de &#x27;animal do campo&#x27;; a ligação com o diabo aparece séculos depois (Sb 2:24; Ap 12:9). <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>3. Na Bíblia hebraica, &#x27;satã&#x27; era um acusador da corte celeste, não o rei do inferno</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/j%C3%B3/1/6\" target=\"_blank\" rel=\"noopener\">Jó 1:6</a> · <a href=\"https://www.bibliaonline.com.br/acf/zc/3/1\" target=\"_blank\" rel=\"noopener\">Zacarias 3:1</a></span><q>Ora, chegado o dia em que os filhos de Deus vieram apresentar-se perante o Senhor, veio também Satanás entre eles.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">É o que mostram Jó 1–2 e Zacarias 3. <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>4. Serpentes comem pó</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/14\" target=\"_blank\" rel=\"noopener\">Gênesis 3:14</a></span><q>Então o Senhor Deus disse à serpente: Porquanto fizeste isso, maldita serás tu dentre todos os animais domésticos, e dentre todos os animais do campo; sobre o t…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Todas as serpentes são carnívoras. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>5. Israelitas chegaram a queimar incenso a uma serpente de bronze</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/nm/21/9\" target=\"_blank\" rel=\"noopener\">Números 21:9</a> · <a href=\"https://www.bibliaonline.com.br/acf/2rs/18/4\" target=\"_blank\" rel=\"noopener\">2 Reis 18:4</a></span><q>Fez, pois, Moisés uma serpente de bronze, e pô-la sobre uma haste; e sucedia que, tendo uma serpente mordido a alguém, quando esse olhava para a serpente de bro…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">O próprio texto conta que Ezequias a destruiu por isso. <a href=\"https://en.wikipedia.org/wiki/Nehushtan\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>6. Uma jumenta falou com Balaão</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/nm/22/28\" target=\"_blank\" rel=\"noopener\">Números 22:28</a></span><q>Nisso abriu o Senhor a boca da jumenta, a qual perguntou a Balaão: Que te fiz eu, para que me espancasses estas três vezes?</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Jumentos não articulam palavras; o relato tem forma de narrativa exemplar. <a href=\"https://en.wikipedia.org/wiki/Balaam%27s_ass\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>7. Na camada mais antiga do texto, Deus é descrito de forma humana: pergunta, passeia, desce para ver</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/9\" target=\"_blank\" rel=\"noopener\">Gênesis 3:9</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/11/5\" target=\"_blank\" rel=\"noopener\">Gênesis 11:5</a></span><q>Mas chamou o Senhor Deus ao homem, e perguntou-lhe: Onde estás?</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Antropomorfismo típico da fonte javista (J). <a href=\"https://en.wikipedia.org/wiki/Jahwist\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>8. A Bíblia é coerente sobre Deus saber tudo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/sl/139/4\" target=\"_blank\" rel=\"noopener\">Salmos 139:4</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/22/12\" target=\"_blank\" rel=\"noopener\">Gênesis 22:12</a></span><q>Não havendo ainda palavra alguma na minha língua, eis que logo, ó Senhor, tudo conheces.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Sl 139 diz que ele sabe tudo; Gn 18:21 e 22:12 mostram um Deus que precisa ver para saber. <a href=\"https://en.wikipedia.org/wiki/Omniscience\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>9. Deus perguntou só para abrir conversa ou para ensinar (Rashi)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/3/9\" target=\"_blank\" rel=\"noopener\">Gênesis 3:9</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/18/21\" target=\"_blank\" rel=\"noopener\">Gênesis 18:21</a></span><q>Mas chamou o Senhor Deus ao homem, e perguntou-lhe: Onde estás?</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">Leitura de fé possível; a intenção não pode ser verificada. <a href=\"https://www.sefaria.org/Rashi_on_Genesis.3.9\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>10. Gênesis explica por que Deus aceitou Abel e rejeitou Caim</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/5\" target=\"_blank\" rel=\"noopener\">Gênesis 4:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/hb/11/4\" target=\"_blank\" rel=\"noopener\">Hebreus 11:4</a></span><q>mas para Caim e para a sua oferta não atentou. Pelo que irou-se Caim fortemente, e descaiu-lhe o semblante.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Não explica; as razões (fé, oferta melhor) foram dadas depois (Hb 11:4; 1 Jo 3:12). <a href=\"https://en.wikipedia.org/wiki/Cain_and_Abel\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>11. Pastores e agricultores conviviam e disputavam no Oriente Próximo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/4\" target=\"_blank\" rel=\"noopener\">Gênesis 4:4</a></span><q>Abel também trouxe dos primogênitos das suas ovelhas, e da sua gordura. Ora, atentou o Senhor para Abel e para a sua oferta,</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Neolítico (~11 mil anos) e o poema sumério &#x27;Dumuzid e Enkimdu&#x27;. <a href=\"https://etcsl.orinst.ox.ac.uk/section4/tr40833.htm\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>12. Caim e Abel eram a segunda geração da humanidade, já pastor e lavrador</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/4\" target=\"_blank\" rel=\"noopener\">Gênesis 4:4</a> · <a href=\"https://www.bibliaonline.com.br/acf/gn/4/14\" target=\"_blank\" rel=\"noopener\">Gênesis 4:14</a></span><q>Abel também trouxe dos primogênitos das suas ovelhas, e da sua gordura. Ora, atentou o Senhor para Abel e para a sua oferta,</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">O Homo sapiens tem ~300 mil anos, quase todos como caçador-coletor antes da agricultura. <a href=\"https://en.wikipedia.org/wiki/Early_modern_human\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>13. A marca de Caim era a pele escura</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/15\" target=\"_blank\" rel=\"noopener\">Gênesis 4:15</a></span><q>O Senhor, porém, lhe disse: Portanto quem matar a Caim, sete vezes sobre ele cairá a vingança. E pôs o Senhor um sinal em Caim, para que não o ferisse quem quer…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">O texto não diz o que era; a leitura racista veio séculos depois e hoje é rejeitada até por igrejas que a usaram. <a href=\"https://en.wikipedia.org/wiki/Curse_and_mark_of_Cain\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>14. Leituras ditas &#x27;bíblicas&#x27; foram usadas para justificar escravidão e racismo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/4/15\" target=\"_blank\" rel=\"noopener\">Gênesis 4:15</a></span><q>O Senhor, porém, lhe disse: Portanto quem matar a Caim, sete vezes sobre ele cairá a vingança. E pôs o Senhor um sinal em Caim, para que não o ferisse quem quer…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Ensaio oficial dos Santos dos Últimos Dias; Goldenberg, &#x27;The Curse of Ham&#x27; (2003). <a href=\"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>15. A própria Bíblia admite que escribas e profetas falavam em nome de Deus com ideias próprias</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/jr/8/8\" target=\"_blank\" rel=\"noopener\">Jeremias 8:8</a> · <a href=\"https://www.bibliaonline.com.br/acf/jr/23/16\" target=\"_blank\" rel=\"noopener\">Jeremias 23:16</a></span><q>Como pois dizeis: Nós somos sábios, e a lei do Senhor está conosco? Mas eis que a falsa pena dos escribas a converteu em mentira.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Jeremias 8:8 e 23:16. <a href=\"https://en.wikipedia.org/wiki/Book_of_Jeremiah\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>16. &#x27;Assim diz o deus&#x27; era fórmula comum de profetas no Antigo Oriente</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/jr/23/16\" target=\"_blank\" rel=\"noopener\">Jeremias 23:16</a></span><q>Assim diz o Senhor dos exércitos: Não deis ouvidos as palavras dos profetas, que vos profetizam a vós, ensinando-vos vaidades; falam da visão do seu coração, nã…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Cartas de Mari (c. 1770 a.C.): &#x27;Assim diz Dagan&#x27;, &#x27;Assim diz Adad&#x27;. <a href=\"https://www.mdpi.com/2077-1444/16/11/1400\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>17. Dizer &#x27;este livro veio de Deus&#x27; prova que ele veio de Deus</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/2tm/3/16\" target=\"_blank\" rel=\"noopener\">2 Timóteo 3:16</a></span><q>Toda Escritura é divinamente inspirada e proveitosa para ensinar, para repreender, para corrigir, para instruir em justiça;</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">É raciocínio circular; outros livros afirmam o mesmo e se contradizem. <a href=\"https://en.wikipedia.org/wiki/Circular_reasoning\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>18. Os autores da Bíblia foram inspirados por Deus</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/2tm/3/16\" target=\"_blank\" rel=\"noopener\">2 Timóteo 3:16</a></span><q>Toda Escritura é divinamente inspirada e proveitosa para ensinar, para repreender, para corrigir, para instruir em justiça;</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">Afirmação de fé: a ciência não prova nem refuta. <a href=\"https://en.wikipedia.org/wiki/Biblical_inspiration\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>19. Chamar um texto de sagrado o torna resistente a perguntas e argumentos</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/4/2\" target=\"_blank\" rel=\"noopener\">Deuteronômio 4:2</a></span><q>Não acrescentareis à palavra que vos mando, nem diminuireis dela, para que guardeis os mandamentos do Senhor vosso Deus, que eu vos mando.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Valores sagrados: Tetlock 2003; Atran e Ginges, Science 2012. <a href=\"https://doi.org/10.1126/science.1216902\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>20. Crianças aceitam como real o que os adultos de confiança ensinam, inclusive milagres</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/pv/22/6\" target=\"_blank\" rel=\"noopener\">Provérbios 22:6</a></span><q>Instrui o menino no caminho em que deve andar, e até quando envelhecer não se desviará dele.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Harris e Koenig 2006; Corriveau, Chen e Harris 2015. <a href=\"https://doi.org/10.1111/cogs.12138\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>21. A religião de uma pessoa depende muito de onde e de quem ela nasceu</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/6/7\" target=\"_blank\" rel=\"noopener\">Deuteronômio 6:7</a></span><q>e as ensinarás a teus filhos, e delas falarás sentado em tua casa e andando pelo caminho, ao deitar-te e ao levantar-te.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Pew 2025: em vários países, 95% ou mais seguem a religião da infância; no Brasil, ~4 em 5. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>22. A maioria das pessoas escolheu a sua religião depois de comparar as outras</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/6/7\" target=\"_blank\" rel=\"noopener\">Deuteronômio 6:7</a> · <a href=\"https://www.bibliaonline.com.br/acf/1co/13/11\" target=\"_blank\" rel=\"noopener\">1 Coríntios 13:11</a></span><q>e as ensinarás a teus filhos, e delas falarás sentado em tua casa e andando pelo caminho, ao deitar-te e ao levantar-te.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A maioria a recebe na infância, antes de poder comparar; a certeza vem do ambiente. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>23. É possível respeitar a fé e examinar o texto ao mesmo tempo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/1ts/5/21\" target=\"_blank\" rel=\"noopener\">1 Tessalonicenses 5:21</a></span><q>Examinai tudo. Retende o bem.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Muitos estudiosos crentes usam o método histórico-crítico. <a href=\"https://en.wikipedia.org/wiki/Historical_criticism\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>24. Existe um Deus por trás dos textos</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/1jo/4/8\" target=\"_blank\" rel=\"noopener\">1 João 4:8</a></span><q>Aquele que não ama não conhece a Deus; porque Deus é amor.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">A ciência não prova nem refuta. O que ela mostra é que os textos têm as marcas de quem os escreveu. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr></tbody></table><p class=\"nota\">Bíblia: Almeida (domínio público). “Não bate com a realidade” quer dizer que, como fato literal, não confere com a evidência; não é um julgamento sobre a fé de ninguém.</p>", "en": "<h1>What is true and what is not</h1><p>Genesis put to the test: what science, history and psychology show. One claim per row, with verse and source.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Does not match reality: 10</span><span style=\"color:#7dcea0\">✅ Matches reality: 11</span><span style=\"color:#e0c36a\">❔ Not verifiable: 3</span></div><table><thead><tr><th>Claim (verse)</th><th>Verdict</th><th>Evidence / source</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>1. A serpent spoke and argued with a woman</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A1&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:1</a></span><q>Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of eve…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Snakes have no vocal cords nor a brain for language; talking animals are a fable device. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>2. In the Genesis text, the serpent was Satan in disguise</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A1&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=Revelation+12%3A9&version=KJV\" target=\"_blank\" rel=\"noopener\">Revelation 12:9</a></span><q>Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of eve…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Genesis calls it a &#x27;beast of the field&#x27;; the link to the devil appears centuries later (Wis 2:24; Rev 12:9). <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>3. In the Hebrew Bible, &#x27;satan&#x27; was an accuser in the heavenly court, not the king of hell</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Job+1%3A6&version=KJV\" target=\"_blank\" rel=\"noopener\">Job 1:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Zechariah+3%3A1&version=KJV\" target=\"_blank\" rel=\"noopener\">Zechariah 3:1</a></span><q>Now there was a day when the sons of God came to present themselves before the LORD, and Satan came also among them.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">That is what Job 1–2 and Zechariah 3 show. <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>4. Snakes eat dust</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:14</a></span><q>And the LORD God said unto the serpent, Because thou hast done this, thou art cursed above all cattle, and above every beast of the field; upon thy belly shalt …</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">All snakes are carnivores. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>5. Israelites came to burn incense to a bronze serpent</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+21%3A9&version=KJV\" target=\"_blank\" rel=\"noopener\">Numbers 21:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=2+Kings+18%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Kings 18:4</a></span><q>And Moses made a serpent of brass, and put it upon a pole, and it came to pass, that if a serpent had bitten any man, when he beheld the serpent of brass, he li…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">The text itself says Hezekiah destroyed it for that reason. <a href=\"https://en.wikipedia.org/wiki/Nehushtan\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>6. A donkey spoke to Balaam</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+22%3A28&version=KJV\" target=\"_blank\" rel=\"noopener\">Numbers 22:28</a></span><q>And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Donkeys can&#x27;t articulate words; the account has the form of an exemplary tale. <a href=\"https://en.wikipedia.org/wiki/Balaam%27s_ass\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>7. In the oldest layer of the text, God is described in human terms: he asks, walks, comes down to see</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A9&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+11%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 11:5</a></span><q>And the LORD God called unto Adam, and said unto him, Where art thou?</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Anthropomorphism typical of the Yahwist source (J). <a href=\"https://en.wikipedia.org/wiki/Jahwist\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>8. The Bible is consistent about God knowing everything</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Psalms+139%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Psalms 139:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+22%3A12&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 22:12</a></span><q>For there is not a word in my tongue, but, lo, O LORD, thou knowest it altogether.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Ps 139 says he knows everything; Gen 18:21 and 22:12 show a God who must see in order to know. <a href=\"https://en.wikipedia.org/wiki/Omniscience\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>9. God asked only to open a conversation or to teach (Rashi)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A9&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 3:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+18%3A21&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 18:21</a></span><q>And the LORD God called unto Adam, and said unto him, Where art thou?</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">A possible faith reading; the intention cannot be verified. <a href=\"https://www.sefaria.org/Rashi_on_Genesis.3.9\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>10. Genesis explains why God accepted Abel and rejected Cain</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Hebrews+11%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Hebrews 11:4</a></span><q>But unto Cain and to his offering he had not respect. And Cain was very wroth, and his countenance fell.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">It doesn&#x27;t; the reasons (faith, a better offering) were given later (Heb 11:4; 1 Jn 3:12). <a href=\"https://en.wikipedia.org/wiki/Cain_and_Abel\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>11. Shepherds and farmers lived side by side and competed in the Near East</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:4</a></span><q>And Abel, he also brought of the firstlings of his flock and of the fat thereof. And the LORD had respect unto Abel and to his offering:</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">The Neolithic (~11,000 years) and the Sumerian poem &#x27;Dumuzid and Enkimdu&#x27;. <a href=\"https://etcsl.orinst.ox.ac.uk/section4/tr40833.htm\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>12. Cain and Abel were humanity&#x27;s second generation, already a shepherd and a farmer</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:14</a></span><q>And Abel, he also brought of the firstlings of his flock and of the fat thereof. And the LORD had respect unto Abel and to his offering:</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Homo sapiens is ~300,000 years old, almost all of it as hunter-gatherers before farming. <a href=\"https://en.wikipedia.org/wiki/Early_modern_human\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>13. The mark of Cain was dark skin</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A15&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:15</a></span><q>And the LORD said unto him, Therefore whosoever slayeth Cain, vengeance shall be taken on him sevenfold. And the LORD set a mark upon Cain, lest any finding him…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The text doesn&#x27;t say what it was; the racist reading came centuries later and is now rejected even by churches that used it. <a href=\"https://en.wikipedia.org/wiki/Curse_and_mark_of_Cain\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>14. Readings called &#x27;biblical&#x27; were used to justify slavery and racism</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A15&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 4:15</a></span><q>And the LORD said unto him, Therefore whosoever slayeth Cain, vengeance shall be taken on him sevenfold. And the LORD set a mark upon Cain, lest any finding him…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Official Latter-day Saint essay; Goldenberg, &#x27;The Curse of Ham&#x27; (2003). <a href=\"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>15. The Bible itself admits scribes and prophets spoke in God&#x27;s name with their own ideas</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+8%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">Jeremiah 8:8</a> · <a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+23%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Jeremiah 23:16</a></span><q>How do ye say, We are wise, and the law of the LORD is with us? Lo, certainly in vain made he it; the pen of the scribes is in vain.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Jeremiah 8:8 and 23:16. <a href=\"https://en.wikipedia.org/wiki/Book_of_Jeremiah\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>16. &#x27;Thus says the god&#x27; was a common prophetic formula in the ancient Near East</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+23%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Jeremiah 23:16</a></span><q>Thus saith the LORD of hosts, Hearken not unto the words of the prophets that prophesy unto you: they make you vain: they speak a vision of their own heart, and…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Mari letters (c. 1770 BC): &#x27;Thus says Dagan&#x27;, &#x27;Thus says Adad&#x27;. <a href=\"https://www.mdpi.com/2077-1444/16/11/1400\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>17. Saying &#x27;this book came from God&#x27; proves it came from God</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Timothy+3%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Timothy 3:16</a></span><q>All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">It&#x27;s circular reasoning; other books claim the same and contradict each other. <a href=\"https://en.wikipedia.org/wiki/Circular_reasoning\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>18. The Bible&#x27;s authors were inspired by God</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Timothy+3%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Timothy 3:16</a></span><q>All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">A statement of faith: science neither proves nor refutes it. <a href=\"https://en.wikipedia.org/wiki/Biblical_inspiration\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>19. Calling a text sacred makes it resistant to questions and arguments</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+4%3A2&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 4:2</a></span><q>Ye shall not add unto the word which I command you, neither shall ye diminish ought from it, that ye may keep the commandments of the LORD your God which I comm…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Sacred values: Tetlock 2003; Atran and Ginges, Science 2012. <a href=\"https://doi.org/10.1126/science.1216902\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>20. Children accept as real what trusted adults teach, miracles included</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Proverbs+22%3A6&version=KJV\" target=\"_blank\" rel=\"noopener\">Proverbs 22:6</a></span><q>Train up a child in the way he should go: and when he is old, he will not depart from it.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Harris and Koenig 2006; Corriveau, Chen and Harris 2015. <a href=\"https://doi.org/10.1111/cogs.12138\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>21. A person&#x27;s religion depends heavily on where and to whom they were born</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+6%3A7&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 6:7</a></span><q>And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Pew 2025: in several countries 95% or more keep their childhood religion; in Brazil, ~4 in 5. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>22. Most people chose their religion after comparing the others</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+6%3A7&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 6:7</a> · <a href=\"https://www.biblegateway.com/passage/?search=1+Corinthians+13%3A11&version=KJV\" target=\"_blank\" rel=\"noopener\">1 Corinthians 13:11</a></span><q>And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Most receive it in childhood, before being able to compare; certainty comes from the surroundings. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>23. It is possible to respect faith and examine the text at the same time</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+Thessalonians+5%3A21&version=KJV\" target=\"_blank\" rel=\"noopener\">1 Thessalonians 5:21</a></span><q>Prove all things; hold fast that which is good.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Many believing scholars use the historical-critical method. <a href=\"https://en.wikipedia.org/wiki/Historical_criticism\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>24. There is a God behind the texts</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">1 John 4:8</a></span><q>He that loveth not knoweth not God; for God is love.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">Science neither proves nor refutes it. What it shows is that the texts bear the marks of their writers. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr></tbody></table><p class=\"nota\">Bible: King James Version (public domain). “Does not match reality” means that as literal fact it does not agree with the evidence; it is not a judgement on anyone&#x27;s faith.</p>", "es": "<h1>Lo que es verdadero y lo que no</h1><p>Génesis a prueba: lo que muestran la ciencia, la historia y la psicología. Una afirmación por fila, con versículo y fuente.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ No coincide con la realidad: 10</span><span style=\"color:#7dcea0\">✅ Coincide con la realidad: 11</span><span style=\"color:#e0c36a\">❔ No verificable: 3</span></div><table><thead><tr><th>Afirmación (versículo)</th><th>Veredicto</th><th>Evidencia / fuente</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>1. Una serpiente habló y discutió con una mujer</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A1&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:1</a></span><q>EMPERO la serpiente era astuta, más que todos los animales del campo que Jehová Dios había hecho; la cual dijo á la mujer: ¿Conque Dios os ha dicho: No comáis d…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Las serpientes no tienen cuerdas vocales ni cerebro para el lenguaje; el animal que habla es recurso de fábula. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>2. En el texto del Génesis, la serpiente era Satanás disfrazado</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A1&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=Revelation+12%3A9&version=RVA\" target=\"_blank\" rel=\"noopener\">Apocalipsis 12:9</a></span><q>EMPERO la serpiente era astuta, más que todos los animales del campo que Jehová Dios había hecho; la cual dijo á la mujer: ¿Conque Dios os ha dicho: No comáis d…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El Génesis la llama &#x27;animal del campo&#x27;; el vínculo con el diablo aparece siglos después (Sab 2:24; Ap 12:9). <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>3. En la Biblia hebrea, &#x27;satán&#x27; era un acusador de la corte celestial, no el rey del infierno</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Job+1%3A6&version=RVA\" target=\"_blank\" rel=\"noopener\">Job 1:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Zechariah+3%3A1&version=RVA\" target=\"_blank\" rel=\"noopener\">Zacarías 3:1</a></span><q>Y un día vinieron los hijos de Dios á presentarse delante de Jehová, entre los cuales vino también Satán.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Es lo que muestran Job 1–2 y Zacarías 3. <a href=\"https://en.wikipedia.org/wiki/Satan\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>4. Las serpientes comen polvo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:14</a></span><q>Y Jehová Dios dijo á la serpiente: Por cuanto esto hiciste, maldita serás entre todas las bestias y entre todos los animales del campo; sobre tu pecho andarás, …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Todas las serpientes son carnívoras. <a href=\"https://en.wikipedia.org/wiki/Snake\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>5. Los israelitas llegaron a quemar incienso a una serpiente de bronce</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+21%3A9&version=RVA\" target=\"_blank\" rel=\"noopener\">Números 21:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=2+Kings+18%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Reyes 18:4</a></span><q>Y Moisés hizo una serpiente de metal, y púsola sobre la bandera: y fué, que cuando alguna serpiente mordía á alguno, miraba á la serpiente de metal, y vivía.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El propio texto cuenta que Ezequías la destruyó por eso. <a href=\"https://en.wikipedia.org/wiki/Nehushtan\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>6. Una burra habló con Balaam</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+22%3A28&version=RVA\" target=\"_blank\" rel=\"noopener\">Números 22:28</a></span><q>Entonces Jehová abrió la boca al asna, la cual dijo á Balaam: ¿Qué te he hecho, que me has herido estas tres veces?</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Los burros no articulan palabras; el relato tiene forma de narración ejemplar. <a href=\"https://en.wikipedia.org/wiki/Balaam%27s_ass\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>7. En la capa más antigua del texto, Dios se describe de forma humana: pregunta, pasea, desciende a ver</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A9&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+11%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 11:5</a></span><q>Y llamó Jehová Dios al hombre, y le dijo: ¿Dónde estás tú?</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Antropomorfismo típico de la fuente yahvista (J). <a href=\"https://en.wikipedia.org/wiki/Jahwist\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>8. La Biblia es coherente sobre que Dios lo sabe todo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Psalms+139%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Salmos 139:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+22%3A12&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 22:12</a></span><q>Pues aun no está la palabra en mi lengua, y he aquí, oh Jehová, tú la sabes toda.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El Sal 139 dice que lo sabe todo; Gn 18:21 y 22:12 muestran a un Dios que necesita ver para saber. <a href=\"https://en.wikipedia.org/wiki/Omniscience\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>9. Dios preguntó solo para abrir conversación o para enseñar (Rashi)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+3%3A9&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 3:9</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+18%3A21&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 18:21</a></span><q>Y llamó Jehová Dios al hombre, y le dijo: ¿Dónde estás tú?</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">Lectura de fe posible; la intención no se puede verificar. <a href=\"https://www.sefaria.org/Rashi_on_Genesis.3.9\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>10. El Génesis explica por qué Dios aceptó a Abel y rechazó a Caín</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Hebrews+11%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Hebreos 11:4</a></span><q>Mas no miró propicio á Caín y á la ofrenda suya. Y ensañóse Caín en gran manera, y decayó su semblante.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">No lo explica; las razones (fe, mejor ofrenda) se dieron después (Heb 11:4; 1 Jn 3:12). <a href=\"https://en.wikipedia.org/wiki/Cain_and_Abel\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>11. Pastores y agricultores convivían y competían en el Oriente Próximo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:4</a></span><q>Y Abel trajo también de los primogénitos de sus ovejas, y de su grosura. Y miró Jehová con agrado á Abel y á su ofrenda;</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El Neolítico (~11.000 años) y el poema sumerio &#x27;Dumuzid y Enkimdu&#x27;. <a href=\"https://etcsl.orinst.ox.ac.uk/section4/tr40833.htm\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>12. Caín y Abel eran la segunda generación de la humanidad, ya pastor y labrador</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:14</a></span><q>Y Abel trajo también de los primogénitos de sus ovejas, y de su grosura. Y miró Jehová con agrado á Abel y á su ofrenda;</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El Homo sapiens tiene ~300.000 años, casi todos como cazador-recolector antes de la agricultura. <a href=\"https://en.wikipedia.org/wiki/Early_modern_human\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>13. La marca de Caín era la piel oscura</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A15&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:15</a></span><q>Y respondióle Jehová: Cierto que cualquiera que matare á Caín, siete veces será castigado. Entonces Jehová puso señal en Caín, para que no lo hiriese cualquiera…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El texto no dice qué era; la lectura racista vino siglos después y hoy la rechazan incluso iglesias que la usaron. <a href=\"https://en.wikipedia.org/wiki/Curse_and_mark_of_Cain\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>14. Lecturas llamadas &#x27;bíblicas&#x27; se usaron para justificar la esclavitud y el racismo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+4%3A15&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 4:15</a></span><q>Y respondióle Jehová: Cierto que cualquiera que matare á Caín, siete veces será castigado. Entonces Jehová puso señal en Caín, para que no lo hiriese cualquiera…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Ensayo oficial de los Santos de los Últimos Días; Goldenberg, &#x27;The Curse of Ham&#x27; (2003). <a href=\"https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>15. La propia Biblia admite que escribas y profetas hablaban en nombre de Dios con ideas propias</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+8%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">Jeremías 8:8</a> · <a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+23%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Jeremías 23:16</a></span><q>¿Cómo decís: Nosotros somos sabios, y la ley de Jehová es con nosotros? Ciertamente, he aquí que en vano se cortó la pluma, por demás fueron los escribas.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Jeremías 8:8 y 23:16. <a href=\"https://en.wikipedia.org/wiki/Book_of_Jeremiah\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>16. &#x27;Así dice el dios&#x27; era una fórmula común de profetas en el Antiguo Oriente</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+23%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Jeremías 23:16</a></span><q>Así ha dicho Jehová de los ejércitos: No escuchéis las palabras de los profetas que os profetizan: os hacen desvanecer; hablan visión de su corazón, no de la bo…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Cartas de Mari (c. 1770 a.C.): &#x27;Así dice Dagán&#x27;, &#x27;Así dice Adad&#x27;. <a href=\"https://www.mdpi.com/2077-1444/16/11/1400\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>17. Decir &#x27;este libro vino de Dios&#x27; prueba que vino de Dios</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Timothy+3%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Timoteo 3:16</a></span><q>Toda Escritura es inspirada divinamente y útil para enseñar, para redargüir, para corregir, para instituir en justicia,</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Es razonamiento circular; otros libros afirman lo mismo y se contradicen. <a href=\"https://en.wikipedia.org/wiki/Circular_reasoning\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>18. Los autores de la Biblia fueron inspirados por Dios</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Timothy+3%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Timoteo 3:16</a></span><q>Toda Escritura es inspirada divinamente y útil para enseñar, para redargüir, para corregir, para instituir en justicia,</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">Afirmación de fe: la ciencia no la prueba ni la refuta. <a href=\"https://en.wikipedia.org/wiki/Biblical_inspiration\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>19. Llamar sagrado a un texto lo vuelve resistente a preguntas y argumentos</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+4%3A2&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 4:2</a></span><q>No añadiréis á la palabra que yo os mando, ni disminuiréis de ella, para que guardéis los mandamientos de Jehová vuestro Dios que yo os ordeno.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Valores sagrados: Tetlock 2003; Atran y Ginges, Science 2012. <a href=\"https://doi.org/10.1126/science.1216902\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>20. Los niños aceptan como real lo que enseñan los adultos de confianza, milagros incluidos</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Proverbs+22%3A6&version=RVA\" target=\"_blank\" rel=\"noopener\">Proverbios 22:6</a></span><q>Instruye al niño en su carrera: aun cuando fuere viejo no se apartará de ella.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Harris y Koenig 2006; Corriveau, Chen y Harris 2015. <a href=\"https://doi.org/10.1111/cogs.12138\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>21. La religión de una persona depende mucho de dónde y de quién nació</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+6%3A7&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 6:7</a></span><q>Y las repetirás á tus hijos, y hablarás de ellas estando en tu casa, y andando por el camino, y al acostarte, y cuando te levantes:</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Pew 2025: en varios países el 95% o más sigue la religión de su infancia; en Brasil, ~4 de 5. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>22. La mayoría de las personas eligió su religión después de comparar las otras</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+6%3A7&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 6:7</a> · <a href=\"https://www.biblegateway.com/passage/?search=1+Corinthians+13%3A11&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Corintios 13:11</a></span><q>Y las repetirás á tus hijos, y hablarás de ellas estando en tu casa, y andando por el camino, y al acostarte, y cuando te levantes:</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La mayoría la recibe en la infancia, antes de poder comparar; la certeza viene del entorno. <a href=\"https://www.pewresearch.org/religion/2025/03/26/around-the-world-many-people-are-leaving-their-childhood-religions/\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>23. Es posible respetar la fe y examinar el texto al mismo tiempo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+Thessalonians+5%3A21&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Tesalonicenses 5:21</a></span><q>Examinadlo todo; retened lo bueno.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Muchos estudiosos creyentes usan el método histórico-crítico. <a href=\"https://en.wikipedia.org/wiki/Historical_criticism\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>24. Existe un Dios detrás de los textos</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Juan 4:8</a></span><q>El que no ama, no conoce á Dios; porque Dios es amor.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">La ciencia no lo prueba ni lo refuta. Lo que muestra es que los textos llevan las marcas de quienes los escribieron. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr></tbody></table><p class=\"nota\">Biblia: Reina-Valera 1909 (dominio público). “No coincide con la realidad” significa que, como hecho literal, no concuerda con la evidencia; no es un juicio sobre la fe de nadie.</p>"};var l=(new URLSearchParams(location.search).get("lang")||"").slice(0,2);if(!C[l]){try{l=String(localStorage.getItem("ms-lang")||"pt").replace(/"/g,"").slice(0,2)}catch(e){l="pt"}if(!C[l])l="pt"}
