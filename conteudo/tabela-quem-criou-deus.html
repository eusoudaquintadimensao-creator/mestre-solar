<script>var C={"pt": "<h1>O que é verdadeiro e o que não é</h1><p>O que a história, a arqueologia e a psicologia mostram. Uma afirmação por linha, com versículo e fonte.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Não bate com a realidade: 8</span><span style=\"color:#7dcea0\">✅ Bate com a realidade: 16</span><span style=\"color:#e0c36a\">❔ Não verificável: 2</span></div><table><thead><tr><th>Afirmação (versículo)</th><th>Veredito</th><th>Evidência / fonte</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>1. A Bíblia foi escrita por uma única pessoa (Moisés) ou ditada pronta do céu</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/34/5\" target=\"_blank\" rel=\"noopener\">Deuteronômio 34:5</a></span><q>Assim morreu ali Moisés, servo do Senhor, na terra de Moabe, conforme a palavra do Senhor.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">O texto narra a morte de Moisés (Dt 34) e mostra fontes com estilos diferentes, escritas ao longo de séculos. <a href=\"https://en.wikipedia.org/wiki/Documentary_hypothesis\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>2. Os textos foram escritos e editados por muitas pessoas, ao longo de cerca de mil anos</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/2rs/22/8\" target=\"_blank\" rel=\"noopener\">2 Reis 22:8</a></span><q>Então disse o sumo sacerdote Hilquias ao escrivão Safã: Achei o livro da lei na casa do Senhor. E Hilquias deu o livro a Safã, e ele o leu.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Consenso acadêmico: fontes/camadas J, E, D, P e edição no exílio e pós-exílio. <a href=\"https://en.wikipedia.org/wiki/Supplementary_hypothesis\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>3. O &#x27;livro da lei&#x27; achado por Josias serviu a uma reforma religiosa e política</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/2rs/22/8\" target=\"_blank\" rel=\"noopener\">2 Reis 22:8</a></span><q>Então disse o sumo sacerdote Hilquias ao escrivão Safã: Achei o livro da lei na casa do Senhor. E Hilquias deu o livro a Safã, e ele o leu.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">A maioria dos estudiosos liga esse livro ao núcleo do Deuteronômio (séc. VII a.C.). <a href=\"https://en.wikipedia.org/wiki/Josiah\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>4. Javé era descrito como um deus da tempestade e da guerra que vinha do sul (Seir, Edom)</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/jz/5/4\" target=\"_blank\" rel=\"noopener\">Juízes 5:4</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/33/2\" target=\"_blank\" rel=\"noopener\">Deuteronômio 33:2</a></span><q>Ó Senhor, saindo tu de Seir, caminhando tu desde o campo de Edom, a terra estremeceu; até os céus gotejaram; até as nuvens gotejaram águas.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Textos antigos da Bíblia e inscrições egípcias sobre os &#x27;shasu de YHW&#x27; apontam essa origem (hipótese bem aceita). <a href=\"https://en.wikipedia.org/wiki/Yahweh\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>5. Israelitas adoraram uma deusa (Aserá, &#x27;rainha dos céus&#x27;) junto com Javé</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/jr/7/18\" target=\"_blank\" rel=\"noopener\">Jeremias 7:18</a> · <a href=\"https://www.bibliaonline.com.br/acf/2rs/23/4\" target=\"_blank\" rel=\"noopener\">2 Reis 23:4</a></span><q>Os filhos apanham a lenha, e os pais acendem o fogo, e as mulheres preparam a massa, para fazerem bolos à rainha dos céus, e oferecem libações a outros deuses, …</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Inscrições de Kuntillet Ajrud (c. 800 a.C.): &#x27;Javé de Samaria e sua Aserá&#x27;. <a href=\"https://en.wikipedia.org/wiki/Kuntillet_Ajrud\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>6. Textos antigos falam de um conselho de deuses</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/sl/82/1\" target=\"_blank\" rel=\"noopener\">Salmos 82:1</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/32/8\" target=\"_blank\" rel=\"noopener\">Deuteronômio 32:8</a></span><q>Deus está na congregação dos poderosos; julga no meio dos deuses.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Sl 82 e Dt 32:8 nos Manuscritos do Mar Morto (&#x27;filhos de Deus&#x27;) ecoam o panteão de El em Ugarit. <a href=\"https://en.wikipedia.org/wiki/Sons_of_God\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>7. O monoteísmo pleno ganhou força no exílio na Babilônia</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/is/45/5\" target=\"_blank\" rel=\"noopener\">Isaías 45:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/ex/34/14\" target=\"_blank\" rel=\"noopener\">Êxodo 34:14</a></span><q>Eu sou o Senhor, e não há outro; fora de mim não há Deus; eu te cingirei, ainda que tu não me conheças;</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Textos antigos pedem lealdade a um deus entre outros (monolatria); Is 40–55 (c. 540 a.C.) nega outros deuses. <a href=\"https://en.wikipedia.org/wiki/Monolatry\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>8. Povos vizinhos tinham deuses de guerra que mandavam exterminar cidades</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/2rs/3/27\" target=\"_blank\" rel=\"noopener\">2 Reis 3:27</a></span><q>Então tomou a seu filho primogênito, que havia de reinar em seu lugar, e o ofereceu em holocausto sobre o muro; pelo que houve grande indignação em Israel; por …</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Estela de Mesa (c. 840 a.C.): Quemós manda atacar Nebo, e 7.000 são &#x27;consagrados ao extermínio&#x27;. <a href=\"https://en.wikipedia.org/wiki/Mesha_Stele\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>9. Deuteronômio usa o modelo dos tratados de lealdade assírios</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/13/6\" target=\"_blank\" rel=\"noopener\">Deuteronômio 13:6</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/28/53\" target=\"_blank\" rel=\"noopener\">Deuteronômio 28:53</a></span><q>Quando te incitar teu irmão, filho da tua mãe, ou teu filho, ou tua filha, ou a mulher do teu seio, ou teu amigo, que te é como a tua alma, dizendo-te em segred…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Paralelos com o tratado de Esarhaddon (672 a.C.): denunciar parentes, maldições de fome e canibalismo. <a href=\"https://en.wikipedia.org/wiki/Esarhaddon\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>10. O texto manda matar meninos e mulheres e poupar as virgens &#x27;para vós&#x27;</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/nm/31/17\" target=\"_blank\" rel=\"noopener\">Números 31:17</a> · <a href=\"https://www.bibliaonline.com.br/acf/nm/31/18\" target=\"_blank\" rel=\"noopener\">Números 31:18</a></span><q>Agora, pois, matai todo o homem entre as crianças, e matai toda a mulher que conheceu algum homem, deitando-se com ele.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Está escrito assim. Hoje seria genocídio e escravidão sexual (Estatuto de Roma, arts. 6, 7 e 8). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>11. O texto atribui a Deus ordens de não deixar sobreviventes, incluindo crianças</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/20/16\" target=\"_blank\" rel=\"noopener\">Deuteronômio 20:16</a> · <a href=\"https://www.bibliaonline.com.br/acf/1sm/15/3\" target=\"_blank\" rel=\"noopener\">1 Samuel 15:3</a></span><q>Porém, das cidades destas nações, que o Senhor teu Deus te dá em herança, nenhuma coisa que tem fôlego deixarás com vida.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Está escrito assim. Hoje seria genocídio e crime de guerra (arts. 6 e 8.2.b.xii). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>12. A conquista de Jericó aconteceu como está narrada</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/js/6/21\" target=\"_blank\" rel=\"noopener\">Josué 6:21</a></span><q>E tudo quanto havia na cidade destruíram totalmente ao fio da espada, desde o homem até à mulher, desde o menino até ao velho, e até ao boi e gado miúdo, e ao j…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Jericó estava praticamente desabitada na época atribuída a Josué (Kenyon; Finkelstein). <a href=\"https://en.wikipedia.org/wiki/Jericho\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>13. Um dilúvio mundial matou toda a vida terrestre fora da arca</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/gn/7/23\" target=\"_blank\" rel=\"noopener\">Gênesis 7:23</a></span><q>Assim foi destruído todo o ser vivente que havia sobre a face da terra, desde o homem até ao animal, até ao réptil, e até à ave dos céus; e foram extintos da te…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Não há camada geológica global de um dilúvio recente; ver o tema &#x27;A matemática do dilúvio&#x27;. <a href=\"https://en.wikipedia.org/wiki/Flood_geology\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>14. Todos os primogênitos do Egito morreram numa noite</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ex/12/29\" target=\"_blank\" rel=\"noopener\">Êxodo 12:29</a></span><q>E aconteceu, à meia-noite, que o Senhor feriu a todos os primogênitos na terra do Egito, desde o primogênito de Faraó, que se sentava em seu trono, até ao primo…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Não há registro egípcio nem evidência arqueológica do Êxodo como narrado. <a href=\"https://en.wikipedia.org/wiki/The_Exodus\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>15. O texto manda matar até um parente que convide a adorar outro deus</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/13/6\" target=\"_blank\" rel=\"noopener\">Deuteronômio 13:6</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/13/10\" target=\"_blank\" rel=\"noopener\">Deuteronômio 13:10</a></span><q>Quando te incitar teu irmão, filho da tua mãe, ou teu filho, ou tua filha, ou a mulher do teu seio, ou teu amigo, que te é como a tua alma, dizendo-te em segred…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Está escrito assim. Hoje violaria o direito à vida e a liberdade de religião (PIDCP, arts. 6 e 18). <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>16. A Bíblia sempre ensinou um inferno de tormento eterno</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ec/9/5\" target=\"_blank\" rel=\"noopener\">Eclesiastes 9:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/sl/6/5\" target=\"_blank\" rel=\"noopener\">Salmos 6:5</a></span><q>Porque os vivos sabem que hão de morrer, mas os mortos não sabem coisa nenhuma, nem tampouco terão eles recompensa, mas a sua memória fica entregue ao esquecime…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">No Antigo Testamento os mortos vão ao Sheol, para todos; destinos diferentes só aparecem em Daniel (c. 165 a.C.). <a href=\"https://en.wikipedia.org/wiki/Sheol\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>17. A ideia de inferno eterno se desenvolveu com influências persas e gregas</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/mt/25/46\" target=\"_blank\" rel=\"noopener\">Mateus 25:46</a> · <a href=\"https://www.bibliaonline.com.br/acf/ap/14/11\" target=\"_blank\" rel=\"noopener\">Apocalipse 14:11</a></span><q>E irão estes para o tormento eterno, mas os justos para a vida eterna.</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Zoroastrismo (juízo final) e helenismo (alma imortal, Tártaro); Ehrman, &#x27;Heaven and Hell&#x27; (2020). <a href=\"https://en.wikipedia.org/wiki/Gehenna\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>18. Crer num deus que vigia e castiga aumenta a obediência e a cooperação no grupo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/lv/26/16\" target=\"_blank\" rel=\"noopener\">Levítico 26:16</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/28/15\" target=\"_blank\" rel=\"noopener\">Deuteronômio 28:15</a></span><q>Então eu também vos farei isto: porei sobre vós terror, a tísica e a febre ardente, que consumam os olhos e atormentem a alma; e semeareis em vão a vossa sement…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Purzycki et al., Nature 2016; Norenzayan, &#x27;Big Gods&#x27; (2013). <a href=\"https://www.nature.com/articles/nature16980\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>19. Deuses moralizadores surgiram só depois de as sociedades ficarem complexas</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/lv/26/16\" target=\"_blank\" rel=\"noopener\">Levítico 26:16</a></span><q>Então eu também vos farei isto: porei sobre vós terror, a tísica e a febre ardente, que consumam os olhos e atormentem a alma; e semeareis em vão a vossa sement…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">O estudo de 2019 (Whitehouse, Nature) foi retratado após críticas; a questão segue em aberto. <a href=\"https://www.nature.com/articles/s41586-021-03655-4\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>20. Uma única pessoa inventou Deus de propósito para controlar o povo</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ex/20/5\" target=\"_blank\" rel=\"noopener\">Êxodo 20:5</a></span><q>Não te encurvarás a elas nem as servirás; porque eu, o Senhor teu Deus, sou Deus zeloso, que visito a iniquidade dos pais nos filhos, até a terceira e quarta ge…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Foram muitas gerações; o controle foi uma função, junto com identidade, consolo e explicação de desastres. <a href=\"https://en.wikipedia.org/wiki/Origins_of_Judaism\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>21. Os traços do Deus dos textos espelham os ideais de reis guerreiros da época</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ex/20/5\" target=\"_blank\" rel=\"noopener\">Êxodo 20:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/dt/7/2\" target=\"_blank\" rel=\"noopener\">Deuteronômio 7:2</a></span><q>Não te encurvarás a elas nem as servirás; porque eu, o Senhor teu Deus, sou Deus zeloso, que visito a iniquidade dos pais nos filhos, até a terceira e quarta ge…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Lealdade exclusiva, extermínio do inimigo e maldições aparecem também em Mesa e nos tratados assírios. <a href=\"https://en.wikipedia.org/wiki/Herem_(war_or_property)\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>22. As pessoas tendem a atribuir a Deus as próprias opiniões</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ex/20/5\" target=\"_blank\" rel=\"noopener\">Êxodo 20:5</a></span><q>Não te encurvarás a elas nem as servirás; porque eu, o Senhor teu Deus, sou Deus zeloso, que visito a iniquidade dos pais nos filhos, até a terceira e quarta ge…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Epley et al., PNAS 2009: estimativas sobre &#x27;o que Deus pensa&#x27; acompanham a opinião da própria pessoa. <a href=\"https://www.pnas.org/doi/10.1073/pnas.0908374106\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>23. A Bíblia é coerente sobre castigar filhos pelos pecados dos pais</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/ex/20/5\" target=\"_blank\" rel=\"noopener\">Êxodo 20:5</a> · <a href=\"https://www.bibliaonline.com.br/acf/ez/18/20\" target=\"_blank\" rel=\"noopener\">Ezequiel 18:20</a></span><q>Não te encurvarás a elas nem as servirás; porque eu, o Senhor teu Deus, sou Deus zeloso, que visito a iniquidade dos pais nos filhos, até a terceira e quarta ge…</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Êx 20:5 diz que sim; Ez 18:20 diz que não. São vozes diferentes. <a href=\"https://en.wikipedia.org/wiki/Book_of_Ezekiel\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmação (versículo)\"><b>24. &#x27;Deus é amor&#x27; combina, ao pé da letra, com as ordens de massacre</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/1jo/4/8\" target=\"_blank\" rel=\"noopener\">1 João 4:8</a> · <a href=\"https://www.bibliaonline.com.br/acf/nm/31/17\" target=\"_blank\" rel=\"noopener\">Números 31:17</a></span><q>Aquele que não ama não conhece a Deus; porque Deus é amor.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❌ Não bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Até apologistas e teólogos recorrem a alegoria, hipérbole ou revelação progressiva para conciliar. <a href=\"https://en.wikipedia.org/wiki/Marcionism\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmação (versículo)\"><b>25. Uma ideia repetida muitas vezes parece mais verdadeira</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/dt/13/6\" target=\"_blank\" rel=\"noopener\">Deuteronômio 13:6</a></span><q>Quando te incitar teu irmão, filho da tua mãe, ou teu filho, ou tua filha, ou a mulher do teu seio, ou teu amigo, que te é como a tua alma, dizendo-te em segred…</q></td><td data-h=\"Veredito\"><span class=\"vd\">✅ Bate com a realidade</span></td><td data-h=\"Evidência / fonte\">Efeito da verdade ilusória (Hasher 1977; Fazio et al. 2015). <a href=\"https://en.wikipedia.org/wiki/Illusory_truth_effect\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmação (versículo)\"><b>26. Existe um Deus por trás dos textos</b><span class=\"ref\"><a href=\"https://www.bibliaonline.com.br/acf/1jo/4/8\" target=\"_blank\" rel=\"noopener\">1 João 4:8</a></span><q>Aquele que não ama não conhece a Deus; porque Deus é amor.</q></td><td data-h=\"Veredito\"><span class=\"vd\">❔ Não verificável</span></td><td data-h=\"Evidência / fonte\">A ciência não prova nem refuta. O que ela mostra é que a imagem de Deus nos textos foi moldada por pessoas. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">fonte ↗</a></td></tr></tbody></table><p class=\"nota\">Bíblia: Almeida (domínio público). “Não bate com a realidade” quer dizer que, como fato literal, não confere com a evidência; não é um julgamento sobre a fé de ninguém. Nas linhas de massacre, “bate” quer dizer que o texto diz exatamente isso.</p>", "en": "<h1>What is true and what is not</h1><p>What history, archaeology and psychology show. One claim per row, with verse and source.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ Does not match reality: 8</span><span style=\"color:#7dcea0\">✅ Matches reality: 16</span><span style=\"color:#e0c36a\">❔ Not verifiable: 2</span></div><table><thead><tr><th>Claim (verse)</th><th>Verdict</th><th>Evidence / source</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>1. The Bible was written by one person (Moses) or dictated ready-made from heaven</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+34%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 34:5</a></span><q>So Moses the servant of the LORD died there in the land of Moab, according to the word of the LORD.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">The text narrates Moses&#x27; death (Deut 34) and shows sources in different styles written over centuries. <a href=\"https://en.wikipedia.org/wiki/Documentary_hypothesis\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>2. The texts were written and edited by many people over about a thousand years</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+22%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Kings 22:8</a></span><q>And Hilkiah the high priest said unto Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah gave the book to Shaphan, and h…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Academic consensus: J, E, D, P sources/layers and editing in and after the exile. <a href=\"https://en.wikipedia.org/wiki/Supplementary_hypothesis\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>3. The &#x27;book of the law&#x27; found by Josiah served a religious and political reform</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+22%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Kings 22:8</a></span><q>And Hilkiah the high priest said unto Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah gave the book to Shaphan, and h…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Most scholars link this book to the core of Deuteronomy (7th century BC). <a href=\"https://en.wikipedia.org/wiki/Josiah\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>4. Yahweh was described as a storm and war god coming from the south (Seir, Edom)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Judges+5%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">Judges 5:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+33%3A2&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 33:2</a></span><q>LORD, when thou wentest out of Seir, when thou marchedst out of the field of Edom, the earth trembled, and the heavens dropped, the clouds also dropped water.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Ancient biblical texts and Egyptian inscriptions about the &#x27;Shasu of YHW&#x27; point to this origin (widely held hypothesis). <a href=\"https://en.wikipedia.org/wiki/Yahweh\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>5. Israelites worshipped a goddess (Asherah, &#x27;queen of heaven&#x27;) along with Yahweh</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+7%3A18&version=KJV\" target=\"_blank\" rel=\"noopener\">Jeremiah 7:18</a> · <a href=\"https://www.biblegateway.com/passage/?search=2+Kings+23%3A4&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Kings 23:4</a></span><q>The children gather wood, and the fathers kindle the fire, and the women knead their dough, to make cakes to the queen of heaven, and to pour out drink offering…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Kuntillet Ajrud inscriptions (c. 800 BC): &#x27;Yahweh of Samaria and his Asherah&#x27;. <a href=\"https://en.wikipedia.org/wiki/Kuntillet_Ajrud\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>6. Ancient texts speak of a council of gods</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Psalms+82%3A1&version=KJV\" target=\"_blank\" rel=\"noopener\">Psalms 82:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+32%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 32:8</a></span><q>God standeth in the congregation of the mighty; he judgeth among the gods.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Ps 82 and Deut 32:8 in the Dead Sea Scrolls (&#x27;sons of God&#x27;) echo El&#x27;s pantheon at Ugarit. <a href=\"https://en.wikipedia.org/wiki/Sons_of_God\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>7. Full monotheism gained strength in the Babylonian exile</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Isaiah+45%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Isaiah 45:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Exodus+34%3A14&version=KJV\" target=\"_blank\" rel=\"noopener\">Exodus 34:14</a></span><q>I am the LORD, and there is none else, there is no God beside me: I girded thee, though thou hast not known me:</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Older texts demand loyalty to one god among others (monolatry); Isa 40–55 (c. 540 BC) denies other gods. <a href=\"https://en.wikipedia.org/wiki/Monolatry\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>8. Neighboring peoples had war gods who ordered cities exterminated</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+3%3A27&version=KJV\" target=\"_blank\" rel=\"noopener\">2 Kings 3:27</a></span><q>Then he took his eldest son that should have reigned in his stead, and offered him for a burnt offering upon the wall. And there was great indignation against I…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Mesha Stele (c. 840 BC): Chemosh orders the attack on Nebo; 7,000 are &#x27;devoted to destruction&#x27;. <a href=\"https://en.wikipedia.org/wiki/Mesha_Stele\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>9. Deuteronomy uses the model of Assyrian loyalty treaties</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 13:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+28%3A53&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 28:53</a></span><q>If thy brother, the son of thy mother, or thy son, or thy daughter, or the wife of thy bosom, or thy friend, which is as thine own soul, entice thee secretly, s…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Parallels with Esarhaddon&#x27;s treaty (672 BC): report relatives, curses of famine and cannibalism. <a href=\"https://en.wikipedia.org/wiki/Esarhaddon\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>10. The text orders killing boys and women and sparing virgins &#x27;for yourselves&#x27;</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A17&version=KJV\" target=\"_blank\" rel=\"noopener\">Numbers 31:17</a> · <a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A18&version=KJV\" target=\"_blank\" rel=\"noopener\">Numbers 31:18</a></span><q>Now therefore kill every male among the little ones, and kill every woman that hath known man by lying with him.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">It is written so. Today: genocide and sexual slavery (Rome Statute, arts. 6, 7 and 8). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>11. The text attributes to God orders to leave no survivors, including children</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+20%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 20:16</a> · <a href=\"https://www.biblegateway.com/passage/?search=1+Samuel+15%3A3&version=KJV\" target=\"_blank\" rel=\"noopener\">1 Samuel 15:3</a></span><q>But of the cities of these people, which the LORD thy God doth give thee for an inheritance, thou shalt save alive nothing that breatheth:</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">It is written so. Today: genocide and a war crime (arts. 6 and 8.2.b.xii). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>12. The conquest of Jericho happened as narrated</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Joshua+6%3A21&version=KJV\" target=\"_blank\" rel=\"noopener\">Joshua 6:21</a></span><q>And they utterly destroyed all that was in the city, both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Jericho was practically uninhabited at the time attributed to Joshua (Kenyon; Finkelstein). <a href=\"https://en.wikipedia.org/wiki/Jericho\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>13. A worldwide flood killed all land life outside the ark</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+7%3A23&version=KJV\" target=\"_blank\" rel=\"noopener\">Genesis 7:23</a></span><q>And every living substance was destroyed which was upon the face of the ground, both man, and cattle, and the creeping things, and the fowl of the heaven; and t…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">There is no global geological layer from a recent flood; see the theme &#x27;The math of the flood&#x27;. <a href=\"https://en.wikipedia.org/wiki/Flood_geology\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>14. All the firstborn of Egypt died in one night</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+12%3A29&version=KJV\" target=\"_blank\" rel=\"noopener\">Exodus 12:29</a></span><q>And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the first…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">There is no Egyptian record or archaeological evidence of the Exodus as narrated. <a href=\"https://en.wikipedia.org/wiki/The_Exodus\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>15. The text orders killing even a relative who invites you to worship another god</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 13:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A10&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 13:10</a></span><q>If thy brother, the son of thy mother, or thy son, or thy daughter, or the wife of thy bosom, or thy friend, which is as thine own soul, entice thee secretly, s…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">It is written so. Today it would violate the right to life and freedom of religion (ICCPR, arts. 6 and 18). <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>16. The Bible always taught a hell of eternal torment</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Ecclesiastes+9%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Ecclesiastes 9:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Psalms+6%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Psalms 6:5</a></span><q>For the living know that they shall die: but the dead know not any thing, neither have they any more a reward; for the memory of them is forgotten.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">In the Old Testament the dead go to Sheol, for all; different fates only appear in Daniel (c. 165 BC). <a href=\"https://en.wikipedia.org/wiki/Sheol\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>17. The idea of eternal hell developed under Persian and Greek influences</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Matthew+25%3A46&version=KJV\" target=\"_blank\" rel=\"noopener\">Matthew 25:46</a> · <a href=\"https://www.biblegateway.com/passage/?search=Revelation+14%3A11&version=KJV\" target=\"_blank\" rel=\"noopener\">Revelation 14:11</a></span><q>And these shall go away into everlasting punishment: but the righteous into life eternal.</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Zoroastrianism (final judgment) and Hellenism (immortal soul, Tartarus); Ehrman, &#x27;Heaven and Hell&#x27; (2020). <a href=\"https://en.wikipedia.org/wiki/Gehenna\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>18. Belief in a watching, punishing god increases obedience and cooperation in the group</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Leviticus+26%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Leviticus 26:16</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+28%3A15&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 28:15</a></span><q>I also will do this unto you; I will even appoint over you terror, consumption, and the burning ague, that shall consume the eyes, and cause sorrow of heart: an…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Purzycki et al., Nature 2016; Norenzayan, &#x27;Big Gods&#x27; (2013). <a href=\"https://www.nature.com/articles/nature16980\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>19. Moralizing gods appeared only after societies became complex</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Leviticus+26%3A16&version=KJV\" target=\"_blank\" rel=\"noopener\">Leviticus 26:16</a></span><q>I also will do this unto you; I will even appoint over you terror, consumption, and the burning ague, that shall consume the eyes, and cause sorrow of heart: an…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">The 2019 study (Whitehouse, Nature) was retracted after critiques; the question remains open. <a href=\"https://www.nature.com/articles/s41586-021-03655-4\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>20. A single person deliberately invented God to control the  iniquity of the fathers upon the children unto th…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Epley et al., PNAS 2009: estimates of &#x27;what God thinks&#x27; track the person&#x27;s own opinion. <a href=\"https://www.pnas.org/doi/10.1073/pnas.0908374106\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>23. The Bible is consistent about punishing children for their parents&#x27; sins</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+20%3A5&version=KJV\" target=\"_blank\" rel=\"noopener\">Exodus 20:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Ezekiel+18%3A20&version=KJV\" target=\"_blank\" rel=\"noopener\">Ezekiel 18:20</a></span><q>Thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto th…</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Ex 20:5 says yes; Ezek 18:20 says no. They are different voices. <a href=\"https://en.wikipedia.org/wiki/Book_of_Ezekiel\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"N\"><td data-h=\"Claim (verse)\"><b>24. &#x27;God is love&#x27; fits, read literally, with the massacre orders</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">1 John 4:8</a> · <a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A17&version=KJV\" target=\"_blank\" rel=\"noopener\">Numbers 31:17</a></span><q>He that loveth not knoweth not God; for God is love.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❌ Does not match reality</span></td><td data-h=\"Evidence / source\">Even apologists and theologians resort to allegory, hyperbole or progressive revelation to reconcile them. <a href=\"https://en.wikipedia.org/wiki/Marcionism\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"B\"><td data-h=\"Claim (verse)\"><b>25. An idea repeated many times seems truer</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=KJV\" target=\"_blank\" rel=\"noopener\">Deuteronomy 13:6</a></span><q>If thy brother, the son of thy mother, or thy son, or thy daughter, or the wife of thy bosom, or thy friend, which is as thine own soul, entice thee secretly, s…</q></td><td data-h=\"Verdict\"><span class=\"vd\">✅ Matches reality</span></td><td data-h=\"Evidence / source\">Illusory truth effect (Hasher 1977; Fazio et al. 2015). <a href=\"https://en.wikipedia.org/wiki/Illusory_truth_effect\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr><tr class=\"X\"><td data-h=\"Claim (verse)\"><b>26. There is a God behind the texts</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=KJV\" target=\"_blank\" rel=\"noopener\">1 John 4:8</a></span><q>He that loveth not knoweth not God; for God is love.</q></td><td data-h=\"Verdict\"><span class=\"vd\">❔ Not verifiable</span></td><td data-h=\"Evidence / source\">Science neither proves nor refutes it. What it shows is that the image of God in the texts was shaped by people. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">source ↗</a></td></tr></tbody></table><p class=\"nota\">Bible: King James Version (public domain). “Does not match reality” means that as literal fact it does not agree with the evidence; it is not a judgement on anyone&#x27;s faith. On massacre rows, “matches” means the text says exactly that.</p>", "es": "<h1>Lo que es verdadero y lo que no</h1><p>Lo que muestran la historia, la arqueología y la psicología. Una afirmación por fila, con versículo y fuente.</p><div class=\"res\"><span style=\"color:#e98a8a\">❌ No coincide con la realidad: 8</span><span style=\"color:#7dcea0\">✅ Coincide con la realidad: 16</span><span style=\"color:#e0c36a\">❔ No verificable: 2</span></div><table><thead><tr><th>Afirmación (versículo)</th><th>Veredicto</th><th>Evidencia / fuente</th></tr></thead><tbody><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>1. La Biblia la escribió una sola persona (Moisés) o fue dictada lista desde el cielo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+34%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 34:5</a></span><q>Y murió allí Moisés siervo de Jehová, en la tierra de Moab, conforme al dicho de Jehová.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">El texto narra la muerte de Moisés (Dt 34) y muestra fuentes de estilos distintos escritas a lo largo de siglos. <a href=\"https://en.wikipedia.org/wiki/Documentary_hypothesis\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>2. Los textos fueron escritos y editados por muchas personas a lo largo de unos mil años</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+22%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Reyes 22:8</a></span><q>Entonces dijo el sumo sacerdote Hilcías á Saphán escriba: El libro de la ley he hallado en la casa de Jehová. E Hilcías dió el libro á Saphán, y leyólo.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Consenso académico: fuentes/capas J, E, D, P y edición en el exilio y después. <a href=\"https://en.wikipedia.org/wiki/Supplementary_hypothesis\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>3. El &#x27;libro de la ley&#x27; hallado por Josías sirvió a una reforma religiosa y política</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+22%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Reyes 22:8</a></span><q>Entonces dijo el sumo sacerdote Hilcías á Saphán escriba: El libro de la ley he hallado en la casa de Jehová. E Hilcías dió el libro á Saphán, y leyólo.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">La mayoría de los estudiosos vincula ese libro al núcleo del Deuteronomio (siglo VII a.C.). <a href=\"https://en.wikipedia.org/wiki/Josiah\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>4. Yahvé era descrito como dios de la tormenta y la guerra que venía del sur (Seir, Edom)</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Judges+5%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">Jueces 5:4</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+33%3A2&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 33:2</a></span><q>Cuando saliste de Seir, oh Jehová, cuando te apartaste del campo de Edom, la tierra tembló, y los cielos destilaron, y las nubes gotearon aguas.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Textos bíblicos antiguos e inscripciones egipcias sobre los &#x27;shasu de YHW&#x27; apuntan a ese origen (hipótesis aceptada). <a href=\"https://en.wikipedia.org/wiki/Yahweh\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>5. Los israelitas adoraron a una diosa (Aserá, &#x27;reina del cielo&#x27;) junto a Yahvé</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Jeremiah+7%3A18&version=RVA\" target=\"_blank\" rel=\"noopener\">Jeremías 7:18</a> · <a href=\"https://www.biblegateway.com/passage/?search=2+Kings+23%3A4&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Reyes 23:4</a></span><q>Los hijos cogen la leña, y los padres encienden el fuego, y las mujeres amasan la masa, para hacer tortas á la reina del cielo y para hacer ofrendas á dioses aj…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Inscripciones de Kuntillet Ajrud (c. 800 a.C.): &#x27;Yahvé de Samaria y su Aserá&#x27;. <a href=\"https://en.wikipedia.org/wiki/Kuntillet_Ajrud\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>6. Textos antiguos hablan de un consejo de dioses</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Psalms+82%3A1&version=RVA\" target=\"_blank\" rel=\"noopener\">Salmos 82:1</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+32%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 32:8</a></span><q>DIOS está en la reunión de los dioses; en medio de los dioses juzga.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Sal 82 y Dt 32:8 en los Manuscritos del Mar Muerto (&#x27;hijos de Dios&#x27;) evocan el panteón de El en Ugarit. <a href=\"https://en.wikipedia.org/wiki/Sons_of_God\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>7. El monoteísmo pleno cobró fuerza en el exilio en Babilonia</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Isaiah+45%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Isaías 45:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Exodus+34%3A14&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 34:14</a></span><q>Yo Jehová, y ninguno más hay: no hay Dios fuera de mí. Yo te ceñiré, aunque tú no me conociste;</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Los textos antiguos piden lealtad a un dios entre otros (monolatría); Is 40–55 (c. 540 a.C.) niega a los otros dioses. <a href=\"https://en.wikipedia.org/wiki/Monolatry\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>8. Los pueblos vecinos tenían dioses de guerra que mandaban exterminar ciudades</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=2+Kings+3%3A27&version=RVA\" target=\"_blank\" rel=\"noopener\">2 Reyes 3:27</a></span><q>Entonces arrebató á su primogénito que había de reinar en su lugar, y sacrificóle en holocausto sobre el muro. Y hubo grande enojo en Israel; y retiráronse de é…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Estela de Mesa (c. 840 a.C.): Quemós manda atacar Nebo; 7.000 son &#x27;consagrados al exterminio&#x27;. <a href=\"https://en.wikipedia.org/wiki/Mesha_Stele\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>9. El Deuteronomio usa el modelo de los tratados de lealtad asirios</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 13:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+28%3A53&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 28:53</a></span><q>Cuando te incitare tu hermano, hijo de tu madre, ó tu hijo, ó tu hija, ó la mujer de tu seno, ó tu amigo que sea como tu alma, diciendo en secreto: Vamos y sirv…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Paralelos con el tratado de Esarhaddon (672 a.C.): denunciar parientes, maldiciones de hambre y canibalismo. <a href=\"https://en.wikipedia.org/wiki/Esarhaddon\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>10. El texto manda matar niños y mujeres y dejar a las vírgenes &#x27;para vosotros&#x27;</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A17&version=RVA\" target=\"_blank\" rel=\"noopener\">Números 31:17</a> · <a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A18&version=RVA\" target=\"_blank\" rel=\"noopener\">Números 31:18</a></span><q>Matad pues ahora todos los varones entre los niños: matad también toda mujer que haya conocido varón carnalmente.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Está escrito así. Hoy sería genocidio y esclavitud sexual (Estatuto de Roma, arts. 6, 7 y 8). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>11. El texto atribuye a Dios órdenes de no dejar sobrevivientes, incluidos niños</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+20%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 20:16</a> · <a href=\"https://www.biblegateway.com/passage/?search=1+Samuel+15%3A3&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Samuel 15:3</a></span><q>Empero de las ciudades de estos pueblos que Jehová tu Dios te da por heredad, ninguna persona dejarás con vida;</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Está escrito así. Hoy sería genocidio y crimen de guerra (arts. 6 y 8.2.b.xii). <a href=\"https://www.icc-cpi.int/sites/default/files/RS-Eng.pdf\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>12. La conquista de Jericó ocurrió como se narra</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Joshua+6%3A21&version=RVA\" target=\"_blank\" rel=\"noopener\">Josué 6:21</a></span><q>Y destruyeron todo lo que en la ciudad había; hombres y mujeres, mozos y viejos, hasta los bueyes, y ovejas, y asnos, á filo de espada.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Jericó estaba prácticamente deshabitada en la época atribuida a Josué (Kenyon; Finkelstein). <a href=\"https://en.wikipedia.org/wiki/Jericho\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>13. Un diluvio mundial mató toda la vida terrestre fuera del arca</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Genesis+7%3A23&version=RVA\" target=\"_blank\" rel=\"noopener\">Génesis 7:23</a></span><q>Así fué destruída toda sustancia que vivía sobre la faz de la tierra, desde el hombre hasta la bestia, y los reptiles, y las aves del cielo; y fueron raídos de …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">No hay una capa geológica global de un diluvio reciente; ver el tema &#x27;La matemática del diluvio&#x27;. <a href=\"https://en.wikipedia.org/wiki/Flood_geology\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>14. Todos los primogénitos de Egipto murieron en una noche</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+12%3A29&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 12:29</a></span><q>Y aconteció que á la medianoche Jehová hirió á todo primogénito en la tierra de Egipto, desde el primogénito de Faraón que se sentaba sobre su trono, hasta el p…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">No hay registro egipcio ni evidencia arqueológica del Éxodo tal como se narra. <a href=\"https://en.wikipedia.org/wiki/The_Exodus\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>15. El texto manda matar incluso a un pariente que invite a adorar a otro dios</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 13:6</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A10&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 13:10</a></span><q>Cuando te incitare tu hermano, hijo de tu madre, ó tu hijo, ó tu hija, ó la mujer de tu seno, ó tu amigo que sea como tu alma, diciendo en secreto: Vamos y sirv…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Está escrito así. Hoy violaría el derecho a la vida y la libertad religiosa (PIDCP, arts. 6 y 18). <a href=\"https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>16. La Biblia siempre enseñó un infierno de tormento eterno</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Ecclesiastes+9%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Eclesiastés 9:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Psalms+6%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Salmos 6:5</a></span><q>Porque los que viven saben que han de morir: mas los muertos nada saben, ni tienen más paga; porque su memoria es puesta en olvido.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">En el Antiguo Testamento los muertos van al Seol, para todos; destinos distintos solo aparecen en Daniel (c. 165 a.C.). <a href=\"https://en.wikipedia.org/wiki/Sheol\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>17. La idea de infierno eterno se desarrolló con influencias persas y griegas</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Matthew+25%3A46&version=RVA\" target=\"_blank\" rel=\"noopener\">Mateo 25:46</a> · <a href=\"https://www.biblegateway.com/passage/?search=Revelation+14%3A11&version=RVA\" target=\"_blank\" rel=\"noopener\">Apocalipsis 14:11</a></span><q>E irán éstos al tormento eterno, y los justos á la vida eterna.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Zoroastrismo (juicio final) y helenismo (alma inmortal, Tártaro); Ehrman, &#x27;Heaven and Hell&#x27; (2020). <a href=\"https://en.wikipedia.org/wiki/Gehenna\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>18. Creer en un dios que vigila y castiga aumenta la obediencia y la cooperación en el grupo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Leviticus+26%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Levítico 26:16</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+28%3A15&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 28:15</a></span><q>Yo también haré con vosotros esto: enviaré sobre vosotros terror, extenuación y calentura, que consuman los ojos y atormenten el alma: y sembraréis en balde vue…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Purzycki et al., Nature 2016; Norenzayan, &#x27;Big Gods&#x27; (2013). <a href=\"https://www.nature.com/articles/nature16980\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>19. Los dioses moralizantes surgieron solo después de que las sociedades se volvieran complejas</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Leviticus+26%3A16&version=RVA\" target=\"_blank\" rel=\"noopener\">Levítico 26:16</a></span><q>Yo también haré con vosotros esto: enviaré sobre vosotros terror, extenuación y calentura, que consuman los ojos y atormenten el alma: y sembraréis en balde vue…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">El estudio de 2019 (Whitehouse, Nature) fue retractado tras críticas; la cuestión sigue abierta. <a href=\"https://www.nature.com/articles/s41586-021-03655-4\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>20. Una sola persona inventó a Dios a propósito para controlar al pueblo</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+20%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 20:5</a></span><q>No te inclinarás á ellas, ni las honrarás; porque yo soy Jehová tu Dios, fuerte, celoso, que visito la maldad de los padres sobre los hijos, sobre los terceros …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Fueron muchas generaciones; el control fue una función, junto con identidad, consuelo y explicación de desastres. <a href=\"https://en.wikipedia.org/wiki/Origins_of_Judaism\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>21. Los rasgos del Dios de los textos reflejan los ideales de los reyes guerreros de la época</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+20%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 20:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+7%3A2&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 7:2</a></span><q>No te inclinarás á ellas, ni las honrarás; porque yo soy Jehová tu Dios, fuerte, celoso, que visito la maldad de los padres sobre los hijos, sobre los terceros …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Lealtad exclusiva, exterminio del enemigo y maldiciones aparecen también en Mesa y en los tratados asirios. <a href=\"https://en.wikipedia.org/wiki/Herem_(war_or_property)\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>22. Las personas tienden a atribuir a Dios sus propias opiniones</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+20%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 20:5</a></span><q>No te inclinarás á ellas, ni las honrarás; porque yo soy Jehová tu Dios, fuerte, celoso, que visito la maldad de los padres sobre los hijos, sobre los terceros …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Epley et al., PNAS 2009: las estimaciones de &#x27;lo que Dios piensa&#x27; siguen la propia opinión. <a href=\"https://www.pnas.org/doi/10.1073/pnas.0908374106\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>23. La Biblia es coherente sobre castigar a los hijos por los pecados de los padres</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Exodus+20%3A5&version=RVA\" target=\"_blank\" rel=\"noopener\">Éxodo 20:5</a> · <a href=\"https://www.biblegateway.com/passage/?search=Ezekiel+18%3A20&version=RVA\" target=\"_blank\" rel=\"noopener\">Ezequiel 18:20</a></span><q>No te inclinarás á ellas, ni las honrarás; porque yo soy Jehová tu Dios, fuerte, celoso, que visito la maldad de los padres sobre los hijos, sobre los terceros …</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Éx 20:5 dice que sí; Ez 18:20 dice que no. Son voces distintas. <a href=\"https://en.wikipedia.org/wiki/Book_of_Ezekiel\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"N\"><td data-h=\"Afirmación (versículo)\"><b>24. &#x27;Dios es amor&#x27; encaja, al pie de la letra, con las órdenes de masacre</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Juan 4:8</a> · <a href=\"https://www.biblegateway.com/passage/?search=Numbers+31%3A17&version=RVA\" target=\"_blank\" rel=\"noopener\">Números 31:17</a></span><q>El que no ama, no conoce á Dios; porque Dios es amor.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❌ No coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Incluso apologistas y teólogos recurren a alegoría, hipérbole o revelación progresiva para conciliarlos. <a href=\"https://en.wikipedia.org/wiki/Marcionism\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"B\"><td data-h=\"Afirmación (versículo)\"><b>25. Una idea repetida muchas veces parece más verdadera</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=Deuteronomy+13%3A6&version=RVA\" target=\"_blank\" rel=\"noopener\">Deuteronomio 13:6</a></span><q>Cuando te incitare tu hermano, hijo de tu madre, ó tu hijo, ó tu hija, ó la mujer de tu seno, ó tu amigo que sea como tu alma, diciendo en secreto: Vamos y sirv…</q></td><td data-h=\"Veredicto\"><span class=\"vd\">✅ Coincide con la realidad</span></td><td data-h=\"Evidencia / fuente\">Efecto de la verdad ilusoria (Hasher 1977; Fazio et al. 2015). <a href=\"https://en.wikipedia.org/wiki/Illusory_truth_effect\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr><tr class=\"X\"><td data-h=\"Afirmación (versículo)\"><b>26. Existe un Dios detrás de los textos</b><span class=\"ref\"><a href=\"https://www.biblegateway.com/passage/?search=1+John+4%3A8&version=RVA\" target=\"_blank\" rel=\"noopener\">1 Juan 4:8</a></span><q>El que no ama, no conoce á Dios; porque Dios es amor.</q></td><td data-h=\"Veredicto\"><span class=\"vd\">❔ No verificable</span></td><td data-h=\"Evidencia / fuente\">La ciencia no lo prueba ni lo refuta. Lo que muestra es que la imagen de Dios en los textos fue moldeada por personas. <a href=\"https://en.wikipedia.org/wiki/Existence_of_God\" target=\"_blank\" rel=\"noopener\">fuente ↗</a></td></tr></tbody></table><p class=\"nota\">Biblia: Reina-Valera 1909 (dominio público). “No coincide con la realidad” significa que, como hecho literal, no concuerda con la evidencia; no es un juicio sobre la fe de nadie. En las filas de masacre, “coincide” significa que el texto dice exactamente eso.</p>"};var l=(new URLSearchParams(location.search).get("lang")||"").slice(0,2);if(!C[l]){try{l=String(localStorage.getItem("ms-lang")||"pt").replace(/"/g,"").slice(0,2)}catch(e){l="pt"}if(!C[l])l="pt"}
